o."]}, {"q": "Qual tecla inicia a apresentação a partir do PRIMEIRO slide?", "o": ["F5", "Shift+F5", "F7", "Esc"], "c": 0, "e": "F5 começa do início. Shift+F5 começa do slide atual. Esc encerra.", "w": ["Shift+F5 começa do slide em que você está.", "F7 é ortografia.", "Esc sai da apresentação."]}, {"q": "Você quer imprimir os slides para o público com linhas ao lado para anotar. Escolha:", "o": ["Folhetos com 3 slides por página", "Slides em página inteira", "Estrutura de tópicos", "Anotações"], "c": 0, "e": "Folheto de 3 slides por página traz linhas de anotação ao lado de cada slide.", "w": ["Gasta muito papel e não tem linhas.", "Mostra só o texto, sem os slides.", "Anotações imprime as SUAS notas de apresentador."]}, {"q": "Para ver suas anotações e o próximo slide enquanto o público vê só o slide atual, use:", "o": ["Modo de Exibição do Apresentador", "Modo de Exibição de Leitura", "Classificação de Slides", "Slide Mestre"], "c": 0, "e": "Com dois monitores (ou projetor), o apresentador vê notas, cronômetro e próximo slide.", "w": ["Leitura mostra a apresentação na janela, sem notas.", "Classificação é para organizar a ordem.", "Slide Mestre é para editar o modelo."]}], "ia": [{"q": "Na atividade do Novo Produto com IA, qual foi a postura certa com o texto gerado?", "o": ["Revisar, corrigir e adaptar: a IA ajuda, mas a responsabilidade é sua", "Copiar tudo sem ler", "Confiar 100%, porque IA não erra", "Apagar tudo e não usar IA nunca"], "c": 0, "e": "IA pode inventar informações, errar números e repetir clichês. Leitura crítica é obrigatória.", "w": ["Sem leitura, erros vão direto para o cliente.", "IA erra e pode inventar dados (as \"alucinações\").", "Usada com critério, a IA economiza tempo."]}, {"q": "Qual pedido (prompt) tende a dar a melhor resposta?", "o": ["\"Crie 5 slogans curtos para uma garrafa térmica inteligente, para jovens de 18 a 25 anos, tom divertido\"", "\"Slogan\"", "\"Faça algo legal\"", "\"Me ajuda?\""], "c": 0, "e": "Bom prompt tem contexto, público, quantidade, formato e tom.", "w": ["Sem contexto, a resposta é genérica.", "Vago demais.", "Não diz o que você precisa."]}, {"q": "Qual dado NUNCA deve ser colado em uma IA pública?", "o": ["Dados sigilosos da empresa ou dados pessoais de clientes (CPF, contratos, senhas)", "O nome do produto fictício", "Uma ideia de slogan", "A paleta de cores"], "c": 0, "e": "O que você cola pode ser guardado pelo serviço. Dados sigilosos e pessoais ficam de fora (LGPD).", "w": ["Produto fictício não é sigiloso.", "Slogan da atividade não expõe ninguém.", "Cores não são dado sigiloso."]}, {"q": "Por que a atividade pedia o REGISTRO dos prompts no Word?", "o": ["Para mostrar o processo, o que a IA entregou e o que você precisou corrigir", "Para aumentar o número de páginas", "Porque a IA exige", "Para não precisar fazer os slides"], "c": 0, "e": "O registro mostra o seu raciocínio e a revisão crítica, que é o que foi avaliado.", "w": ["Página a mais não é qualidade.", "A IA não exige isso.", "Os slides continuam necessários."]}, {"q": "A IA informou que \"72% das empresas exigem soft skills\", sem fonte. Antes de usar no trabalho, você deve:", "o": ["Procurar o dado em uma fonte confiável e citar o link; sem fonte, não usar", "Usar, porque a IA disse", "Arredondar para 70% e usar", "Colocar \"fonte: IA\""], "c": 0, "e": "Número sem fonte pode ter sido inventado. Confira em pesquisa séria e cite.", "w": ["IA não é fonte primária.", "Arredondar não deixa o dado verdadeiro.", "\"IA\" não é fonte verificável."]}], "edital": [{"q": "No Edital, o total da proposta no Excel deu R$ 412.380,00. No Word e no PowerPoint o valor deve ser:", "o": ["Exatamente o mesmo: R$ 412.380,00", "Arredondado para R$ 400 mil", "Um pouco menor, para parecer mais barato", "Não precisa aparecer"], "c": 0, "e": "Regra 14 do Edital: o valor no Word e no PowerPoint deve ser igual ao calculado no Excel. Coerência entre arquivos é avaliada.", "w": ["Arredondar cria diferença entre documentos.", "Valor diferente é informação falsa.", "O valor é parte obrigatória da proposta."]}, {"q": "Veio a \"alteração surpresa\" do Edital. Qual é o cuidado com as versões?", "o": ["Salvar uma nova versão (ex.: Proposta_v2) e atualizar Excel, Word, gráficos e PowerPoint", "Mudar só o Excel", "Começar tudo do zero", "Ignorar, porque o arquivo já estava pronto"], "c": 0, "e": "Controle de versões: o v1 fica guardado e o v2 reflete a nova regra em todos os arquivos.", "w": ["Word e slides ficariam com valores antigos.", "Desperdiça o trabalho feito.", "A comissão avalia justamente a adaptação."]}, {"q": "Qual é o assunto obrigatório do e-mail de entrega da proposta?", "o": ["Proposta Comercial - Edital Simulado 001/2026 - Nome da Empresa", "Segue", "Trabalho", "Oi professor"], "c": 0, "e": "O Edital define o assunto. Assunto claro identifica o e-mail na hora.", "w": ["\"Segue\" não diz o que segue.", "Genérico demais.", "Informal e sem identificação."]}, {"q": "Quais arquivos vão anexados no e-mail de protocolo?", "o": ["Proposta em PDF, planilha Excel completa e apresentação PowerPoint", "Só o Word editável", "Só um print da planilha", "As imagens da pesquisa de mercado"], "c": 0, "e": "O item 10.2 do Edital lista os três: PDF da proposta técnica e comercial, .xlsx e .pptx.", "w": ["O Word vai em PDF, junto com os outros dois.", "Print não é a planilha.", "As imagens não são entregáveis do protocolo."]}, {"q": "Por que a proposta mais barata NÃO vence automaticamente?", "o": ["Porque a comissão avalia qualidade, garantia, suporte, coerência e apresentação", "Porque o Excel calcula errado", "Porque preço não importa", "Porque o PowerPoint vale mais que tudo"], "c": 0, "e": "Os critérios do item 13 somam 100 pontos; preço e custo-benefício valem 10.", "w": ["O Excel calcula o que você mandar.", "Preço importa, mas é um critério entre vários.", "PowerPoint vale 15 de 100."]}], "basico": [{"q": "Como se chama o encontro de uma coluna com uma linha, como B4?", "o": ["Célula", "Guia", "Intervalo", "Pasta de trabalho"], "c": 0, "e": "Cada célula tem um endereço: letra da coluna + número da linha. B4 = coluna B, linha 4.", "w": ["Guia é cada planilha da pasta (as abas embaixo).", "Intervalo é um conjunto de células, como B2:B10.", "Pasta de trabalho é o arquivo .xlsx inteiro."]}, {"q": "O arquivo do Excel (.xlsx) com várias guias dentro se chama:", "o": ["Pasta de trabalho", "Documento", "Apresentação", "Banco de dados"], "c": 0, "e": "Uma pasta de trabalho guarda várias planilhas (guias), como 01_PESQUISA, 02_PROPOSTA...", "w": ["Documento é o nome do arquivo do Word.", "Apresentação é o arquivo do PowerPoint.", "Banco de dados é outro tipo de sistema."]}, {"q": "O valor 1500 deve aparecer como R$ 1.500,00. O que fazer?", "o": ["Aplicar o formato Moeda (ou Contábil) na célula", "Digitar \"R$ 1.500,00\" como texto", "Multiplicar por 100", "Mudar a fonte para Arial"], "c": 0, "e": "O formato só muda a aparência: o valor continua sendo número e entra nas contas.", "w": ["Digitado como texto, o valor pode não entrar nas somas.", "Multiplicar muda o valor.", "Fonte não mostra o R$."]}, {"q": "Você precisa de uma guia nova para a pesquisa de preços. Como criar e dar nome?", "o": ["Clicar no + ao lado das guias e dar duplo clique no nome para renomear", "Abrir outro arquivo", "Inserir > Tabela", "Apertar F7"], "c": 0, "e": "Guias com nomes claros (01_PESQUISA) deixam a pasta de trabalho organizada.", "w": ["Outro arquivo separa dados que deveriam ficar juntos.", "Tabela formata dados, não cria guia.", "F7 é ortografia."]}, {"q": "O título \"Proposta Comercial\" deve ficar centralizado em cima das colunas A até F. O recurso é:", "o": ["Mesclar e Centralizar (ou Centralizar na Seleção)", "Quebrar Texto Automaticamente", "Classificar", "Congelar Painéis"], "c": 0, "e": "Une as células da linha do título e centraliza o texto sobre a tabela.", "w": ["Quebrar texto faz o texto ocupar mais linhas na mesma célula.", "Classificar ordena dados.", "Congelar deixa linhas visíveis ao rolar."]}], "recursos": [{"q": "Para transformar a lista de produtos numa tabela com filtro, cores alternadas e linha de total fácil:", "o": ["Página Inicial > Formatar como Tabela", "Pintar linha por linha", "Inserir > Imagem", "Mesclar todas as células"], "c": 0, "e": "A tabela já vem com filtro nos títulos e cresce sozinha quando você acrescenta linhas.", "w": ["Pintar à mão é lento e não cria filtro.", "Imagem não tem dados.", "Mesclar atrapalha classificar e filtrar."]}, {"q": "A coluna Status só pode aceitar \"Pendente\", \"Concluído\" ou \"Cancelado\". Qual recurso cria a lista suspensa?", "o": ["Dados > Validação de Dados > Lista", "Formatação Condicional", "Inserir > Gráfico", "PROCV"], "c": 0, "e": "A validação evita erros de digitação (que depois atrapalham CONT.SE e SOMASE).", "w": ["Formatação condicional pinta, mas não limita o que se digita.", "Gráfico mostra dados.", "PROCV busca, não restringe a digitação."]}, {"q": "Para resumir 500 vendas por vendedor e por mês, sem escrever fórmulas, use:", "o": ["Inserir > Tabela Dinâmica", "Uma SOMA para cada vendedor digitada à mão", "Formatação Condicional", "Classificar de A a Z"], "c": 0, "e": "A tabela dinâmica agrupa e soma arrastando campos: vendedor nas linhas, mês nas colunas, valor nos valores.", "w": ["Funciona, mas é lento e fácil de errar.", "Formatação condicional só destaca.", "Classificar ordena, não resume."]}, {"q": "Colegas vão preencher a planilha, mas as fórmulas não podem ser apagadas. O recurso é:", "o": ["Revisão > Proteger Planilha (deixando desbloqueadas só as células de digitação)", "Esconder a planilha", "Mudar a cor das fórmulas", "Salvar em PDF"], "c": 0, "e": "Proteger impede mudar células bloqueadas. Antes, desbloqueie as células que podem ser preenchidas (Formatar Células > Proteção).", "w": ["Esconder não impede quem reexibir.", "Cor não protege.", "PDF não deixa ninguém preencher."]}, {"q": "O texto \"Notebook com 16 GB de RAM e SSD de 512 GB\" não cabe na célu  problema que o produto resolve, de forma clara e rápida", "A lista de todos os prompts usados", "A história da empresa desde a fundação", "Os agradecimentos"], "c": 0, "e": "Pitch começa prendendo a atenção: qual problema e por que importa.", "w": ["Os prompts vão no registro do Word.", "Tempo curto não comporta história longa.", "Agradecimentos ficam para o fim."]}, {"q": "Qual é o papel dos slides numa apresentação profissional?", "o": ["Apoiar a fala com imagens, números e palavras-chave", "Substituir o apresentador", "Ter todo o texto do relatório", "Mostrar efeitos em todos os objetos"], "c": 0, "e": "Quem convence é o apresentador; o slide ajuda o público a entender e lembrar.", "w": ["Sem apresentador, o slide vira documento.", "Relatório completo vai no Word.", "Efeitos demais distraem."]}], "rev_word": [{"q": "O relatório tem capa, sumário e 6 páginas. A numeração deve começar só depois da capa. Qual recurso permite isso?", "o": ["Quebra de Seção depois da capa e numeração só na segunda seção (ou Primeira Página Diferente)", "Apagar o número da capa com a borracha", "Digitar os números à mão a partir da página 2", "Colocar a capa em outro arquivo"], "c": 0, "e": "Seções e a opção Primeira Página Diferente controlam onde o cabeçalho e o rodapé aparecem.", "w": ["Número automático não se apaga numa página só.", "Número digitado fica errado quando o texto muda.", "Separar a capa complica a entrega em PDF."]}, {"q": "Você mudou o estilo Título 1 para azul, aumentou o texto e o sumário ficou com páginas erradas. Ordem certa antes de exportar:", "o": ["Atualizar o sumário (índice inteiro), conferir com F7 e então Salvar como PDF", "Exportar o PDF primeiro e atualizar depois", "Apagar o sumário", "Mandar o .docx para a comissão"], "c": 0, "e": "Atualizar → revisar → exportar: o PDF sai com o conteúdo final.", "w": ["O PDF já sairia com as páginas erradas.", "Sem sumário, a proposta perde organização.", "A comissão pede o PDF."]}, {"q": "Qual dupla de atalhos está const hz=n=>440*Math.pow(2,(n-69)/12);
function tom(f,dur,tipo,vol,quando,dest){const c=audio();if(!c)return;const t=Math.max(c.currentTime,quando||c.currentTime);const o=c.createOscillator(),g=c.createGain();
 o.type=tipo||'square';o.frequency.setValueAtTime(f,t);g.gain.setValueAtTime(0.0001,t);g.gain.linearRampToValueAtTime(vol||.12,t+.005);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
 o.connect(g);g.connect(dest||SOM.master);o.start(t);o.stop(t+dur+.03)}
function seq(notas,passo,tipo,vol,dur){const c=audio();if(!c)return;const t0=c.currentTime+.01;notas.forEach((n,i)=>{if(n)tom(hz(n),dur||passo*1.6,tipo,vol,t0+i*passo)})}

function agendar(){const c=SOM.ctx;if(!c||!SOM.faixa)return;const[mel,bx,dt]=FAIXAS[SOM.faixa];
 while(SOM.prox<c.currentTime+.15){const i=SOM.passo%mel.length;if(mel[i])tom(hz(mel[i]),dt*1.5,'square',.05,SOM.prox,SOM.musG);
  if(i%8===0)tom(hz(bx[(i/8)|0]),dt*3,'triangle',.12,SOM.prox,SOM.musG);if(i%8===4)tom(hz(bx[(i/8)|0]+7),dt*2,'triangle',.08,SOM.prox,SOM.musG);

  SOM.passo++;SOM.prox+=dt}}

function analisar(S){const out={lugares:[],ind:Object.fromEntries(IND_K.map(k=>[k,[]])),textos:[],fases:[]};
 for(const lv of LEVELS){const jogou=!!(S.P||{})[lv.id];const p=(S.P||{})[lv.id]||{feito:{},erros:{},missao:{},textos:{}};let tot=0,fe=0;
  lv.fases.forEach((f,k)=>Object.entries(f.lugares).forEach(([id,l])=>{if(l.tipo==='portao')return;tot++;const feito=!!p.feito[id];if(feito)fe++;const er=(p.erros||{})[id]||0;
   const conceito=l.card!=null?CARDS[l.card].t:l.nome;const nivel=!feito?'fraco':er<=1?'bom':er<=3?'medio':'fraco';
   const it={fase:lv.nome,regiao:f.nome,id,nome:l.nome,conceito,tipo:l.tipo,feito,erros:er,nivel,ind:l.ind||[],jogou};out.lugares.push(it);if(jogou)(l.ind||[]).forEach(i=>out.ind[i].push(it));
   if(l.tipo==='missoes'){const M=MISSOES[l.miss];M.lista.forEach((m,ix)=>{const v=(p.textos||{})[id+'#'+ix];if(m.tipo==='escrever')out.textos.push({fase:lv.nome,t:m.t,modo:m.modo,txt:v||'',ok:((p.missao||{})[id]||0)>ix})})}}));
  out.fases.push({nome:lv.nome,titulo:lv.titulo,feitos:fe,total:tot,jogou})}
 {const L=out.lugares.filter(x=>x.tipo!=='portao');const pts=L.reduce((t,x)=>t+(!x.feito?0:x.tipo!=='batalha'?1:x.erros<=1?1:x.erros<=3?0.8:0.6),0);out.nota=L.length?Math.round(pts/L.length*100)/10:0}
 out.sug={};for(const i of IND_K){const L=out.ind[i];if(!L.length){out.sug[i]='—';continue}const feitos=L.filter(x=>x.feito).length,bons=L.filter(x=>x.nivel==='bom').length;
  out.sug[i]=feitos===L.length&&bons/L.length>=0.7?'A':feitos/L.length>=0.5?'PA':'NA'}
