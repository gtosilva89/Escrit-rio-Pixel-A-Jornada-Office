<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Escritório Pixel – A Jornada Office</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@500;700&family=VT323&display=swap">
<style>
/* Layout: HUD de RPG no topo, mapa em pixel art à esquerda, diário de viagem à direita; cenas em janela de diálogo estilo console 16-bit */
:root{
  --noite:#14112a; --painel:#221c40; --borda:#f2e9d8; --texto:#f2e9d8; --suave:#b8b0d6;
  --ouro:#ffcf4a; --vida:#ff5d73; --ok:#7ae582; --mana:#5ec8ff; --sombra:#0a0818;
  --f-tit:'Pixelify Sans', ui-monospace, 'Courier New', monospace;
  --f-txt:'VT323', ui-monospace, 'Courier New', monospace;
  color-scheme:dark;
}
[hidden]{display:none!important}
button.som[aria-pressed="false"]{opacity:.6;text-decoration:line-through}
html,body{height:100%}
body{background:var(--noite);color:var(--texto);font-family:var(--f-txt);font-size:22px;line-height:1.15;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px;}
*{box-sizing:border-box}
button{font-family:var(--f-txt);font-size:22px;color:var(--noite);background:var(--ouro);border:0;padding:8px 14px;cursor:pointer;
  box-shadow:0 4px 0 #b8860b, 0 0 0 3px var(--sombra);}
button:hover{filter:brightness(1.08)} button:active{transform:translateY(3px);box-shadow:0 1px 0 #b8860b,0 0 0 3px var(--sombra)}
button:focus-visible,input:focus-visible{outline:3px dashed var(--mana);outline-offset:3px}
button.sec{background:var(--suave);box-shadow:0 4px 0 #6f6894,0 0 0 3px var(--sombra)}
button:disabled{opacity:.45;cursor:not-allowed}
.px{border:3px solid var(--borda);box-shadow:0 0 0 3px var(--sombra),6px 6px 0 3px var(--sombra);background:var(--painel)}
h1,h2,h3{font-family:var(--f-tit);font-weight:400;text-wrap:balance;margin:0}
.wrap{max-width:1280px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
/* HUD */
.hud{display:flex;flex-wrap:wrap;gap:10px 22px;align-items:center;padding:10px 14px}
.hud h1{font-size:20px;color:var(--ouro);letter-spacing:1px}
.stat{display:flex;gap:8px;align-items:center;min-width:0}
.stat b{font-family:var(--f-tit);font-size:14px;color:var(--suave);font-weight:400}
.hearts{letter-spacing:2px;color:var(--vida);font-size:26px}
.xpbar{width:150px;height:14px;background:var(--sombra);border:2px solid var(--borda);position:relative}
.xpbar i{position:absolute;inset:0 auto 0 0;background:var(--mana);width:0}
.selos{display:flex;gap:6px;flex-wrap:wrap}
.selo{font-family:var(--f-tit);font-size:13px;background:var(--ouro);color:var(--noite);padding:4px 6px}
.hud .spacer{flex:1}
/* área principal */
.main{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:14px}
@media (max-width:860px){.main{grid-template-columns:minmax(0,1fr)}}
.mapa{position:relative;aspect-ratio:320/184;max-width:100%;padding:0}
.mapa canvas{width:100%;height:100%;display:block;image-rendering:pixelated;image-rendering:crisp-edges;cursor:pointer}
.lbl{position:absolute;transform:translate(-50%,0);font-size:17px;padding:1px 6px;background:rgba(10,8,24,.82);color:var(--texto);
  white-space:nowrap;pointer-events:none;border:2px solid transparent}
.lbl.disp{border-color:var(--ouro);color:var(--ouro)} .lbl.feito{color:var(--ok)} .lbl.trava{color:#8a84a8}
@media (max-width:620px){.lbl{font-size:13px;padding:0 3px}}
.diario{padding:12px;display:flex;flex-direction:column;gap:8px;min-width:0}
.diario h2{font-size:16px;color:var(--ouro);margin-bottom:4px}
.lugar{display:flex;justify-content:space-between;gap:8px;align-items:center;background:transparent;color:var(--texto);box-shadow:none;padding:4px 6px;text-align:left;border:2px solid #3b3366;font-size:20px}
.lugar:hover{border-color:var(--ouro)} .lugar small{font-size:16px;color:var(--suave)}
.lugar.feito small{color:var(--ok)} .lugar.disp small{color:var(--ouro)}
.lugar:disabled{opacity:.5}
.dica{font-size:18px;color:var(--suave)}
/* cena */
.veu{position:fixed;inset:0;background:rgba(10,8,24,.78);display:flex;align-items:center;justify-content:center;z-index:20;
  padding:calc(12px + env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px))}
.cena{width:min(820px,100%);max-height:100%;overflow:auto;padding:18px;display:flex;flex-direction:column;gap:12px}
.cena h2{font-size:20px;color:var(--ouro);line-height:1.5}
.npc{display:flex;gap:14px;align-items:flex-start}
.npc canvas{width:96px;height:96px;image-rendering:pixelated;flex:none;border:3px solid var(--borda);background:#2d2655}
.fala{font-size:24px;min-width:0}
.fala .quem{font-family:var(--f-tit);font-size:14px;color:var(--mana);display:block;margin-bottom:6px}
.acoes{display:flex;gap:12px;flex-wrap:wrap;justify-content:flex-end}
.perg{border:3px dashed #e8d9a8;background:#f6ecd0;color:#3a2a14;padding:14px 16px;font-size:22px;line-height:1.2}
.perg h3{font-size:17px;color:#7a3d14;margin-bottom:10px;line-height:1.6}
.perg p{margin:0 0 8px} .perg .ex{background:#ead9a8;padding:8px;border-left:6px solid #b5442e}
.arena{display:grid;grid-template-columns:auto minmax(0,1fr);gap:14px;align-items:center}
@media (max-width:560px){.arena{grid-template-columns:minmax(0,1fr)}}
.arena canvas{width:120px;height:120px;image-rendering:pixelated;justify-self:center}
.hpb{height:14px;background:var(--sombra);border:2px solid var(--borda);position:relative;margin-top:6px}
.hpb i{position:absolute;inset:0 auto 0 0;background:var(--vida);transition:width .3s}
.ops{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (max-width:560px){.ops{grid-template-columns:minmax(0,1fr)}}
.ops button{background:var(--painel);color:var(--texto);box-shadow:0 0 0 3px var(--borda);text-align:left;font-size:21px;padding:10px 12px}
.ops button:hover{background:#2f2758}
.ops button.certo{background:#1f5f3a;box-shadow:0 0 0 3px var(--ok)} .ops button.errado{background:#6b1f2c;box-shadow:0 0 0 3px var(--vida)}
.fb{font-size:21px;padding:8px 10px;border-left:6px solid var(--mana);background:#1a1533}
.fb.ok{border-color:var(--ok)} .fb.no{border-color:var(--vida)}
.chips{display:flex;flex-wrap:wrap;gap:10px}
.chip{background:var(--painel);color:var(--texto);box-shadow:0 0 0 3px #6f6894;font-size:21px}
.chip[aria-pressed="true"]{background:var(--mana);color:var(--noite);box-shadow:0 0 0 3px var(--borda)}
.regras{display:grid;gap:4px;font-size:20px}
.regras div{display:grid;grid-template-columns:58px minmax(0,1fr);gap:6px;background:#1a1533;padding:4px 8px}
.regras b{color:var(--ouro);font-family:var(--f-tit);font-size:13px;padding-top:5px}
.linha{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px;align-items:center}
@media (max-width:560px){.linha{grid-template-columns:minmax(0,1fr)}}
select,input{font-family:var(--f-txt);font-size:22px;background:var(--sombra);color:var(--texto);border:3px solid var(--borda);padding:6px 8px;max-width:100%}
.tit-inicio{font-size:clamp(26px,5vw,46px);color:var(--ouro);line-height:1.4;text-shadow:4px 4px 0 var(--sombra)}
.avs{display:flex;gap:12px;flex-wrap:wrap}
.avs button{background:#2d2655;box-shadow:0 0 0 3px #6f6894;padding:6px}
.avs button[aria-pressed="true"]{box-shadow:0 0 0 3px var(--ouro);background:#3b3366}
.avs canvas{width:64px;height:80px;image-rendering:pixelated;display:block}
.ficha table{width:100%;border-collapse:collapse;font-size:20px}
.ficha td,.ficha th{border-bottom:2px solid #3b3366;padding:4px 6px;text-align:left}
.ficha th{font-family:var(--f-tit);font-size:13px;color:var(--suave);font-weight:400}
.num{font-variant-numeric:tabular-nums}
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:40;font-family:var(--f-tit);font-size:16px;background:var(--ouro);color:var(--noite);padding:10px 14px;box-shadow:0 0 0 3px var(--sombra)}
.tremer{animation:tre .35s}
@keyframes tre{25%{transform:translateX(-6px)}50%{transform:translateX(6px)}75%{transform:translateX(-3px)}}
@media (prefers-reduced-motion:reduce){.tremer{animation:none}.hpb i{transition:none}}
.hud .dif{font-family:var(--f-tit);font-size:14px;background:var(--mana);color:var(--noite);padding:4px 6px}
.lbl.regiao{font-family:var(--f-tit);font-size:14px;padding:4px 6px;border-color:var(--borda)}
.lbl.regiao.trava{color:#8a84a8;border-color:#3b3366}
.reg{font-family:var(--f-tit);font-size:13px;color:var(--mana);margin-top:8px;display:flex;justify-content:space-between;align-items:center;gap:6px;line-height:1.5}
.reg.trava{color:#8a84a8}
.mini{font-size:16px;padding:2px 8px;box-shadow:0 2px 0 #b8860b,0 0 0 2px var(--sombra)}
.arte{width:100%;max-width:480px;aspect-ratio:96/54;image-rendering:pixelated;align-self:center;border:3px solid var(--borda)}
.tbw{overflow-x:auto;max-width:100%}
.tb{border-collapse:collapse;font-size:20px;min-width:100%}
.tb th,.tb td{border:2px solid #3b3366;padding:3px 8px;text-align:left;white-space:nowrap}
.tb th{background:#004f8b;color:#fff;font-weight:400}
.cod{background:#0a0818;color:#80ed99;border:2px solid #3b3366;padding:10px 12px;margin:0;font-family:ui-monospace,'Courier New',monospace;font-size:15px;line-height:1.35;overflow-x:auto;white-space:pre}
.nvs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (max-width:620px){.nvs{grid-template-columns:minmax(0,1fr)}}
.nv{border:3px solid var(--borda);padding:10px 12px;display:flex;flex-direction:column;gap:6px;background:#1a1533;min-width:0}
.nv.facil{border-color:var(--ok)} .nv.medio{border-color:var(--ouro)} .nv.dificil{border-color:var(--mana)} .nv.expert{border-color:#c77dff}
.nv.mestre{border-color:#ff77a8;grid-column:1/-1}
.nv.trava{opacity:.8;border-style:dashed}
.nvtop{display:flex;justify-content:space-between;gap:8px}
.nvn{font-family:var(--f-tit);font-size:17px;color:var(--ouro)}
.nvt{font-size:24px}
.fh{font-size:10px;color:var(--mana);margin:8px 0 4px;line-height:1.5}
summary{cursor:pointer;color:var(--suave)}
textarea.escreve{width:100%;font-family:var(--f-txt);font-size:22px;background:#0f0c22;color:var(--texto);border:3px solid var(--borda);padding:8px;resize:vertical}
textarea.cod{font-family:ui-monospace,Consolas,'Courier New',monospace;font-size:17px;color:#80ed99}
label.teste{display:flex;gap:8px;align-items:center;font-size:21px}
label.teste input{width:20px;height:20px}
.fala{white-space:pre-wrap}
.cena.largo{width:min(1280px,100%)}.codsalvo{font-family:monospace;font-size:34px;letter-spacing:3px;text-align:center;padding:14px;background:#fff8dc;color:#1a1533;border:4px dashed var(--ouro);word-break:break-all;user-select:all}.fala.alerta{border-color:#c53030;color:#ffd7d7}.ph{font-size:11px;color:var(--ouro);margin:14px 0 6px}.tag{display:inline-block;padding:1px 8px;color:#fff;font-size:18px}.calor td,.calor th{text-align:center;font-size:15px}.calor th{writing-mode:vertical-rl;transform:rotate(180deg);font-size:13px}.calor td:first-child{text-align:left}button.mini{font-size:15px;padding:2px 8px}.cena ol,.cena p{font-size:19px}
</style>
</head><body>
<div class="wrap">
  <header class="hud px" aria-label="Status do aventureiro">
    <h1>ESCRITÓRIO PIXEL</h1>
    <span class="dif" id="hDif">—</span>
    <div class="stat"><b>HERÓI</b><span id="hNome">—</span></div>
    <div class="stat"><b>VIDA</b><span class="hearts" id="hVida" aria-live="polite"></span></div>
    <div class="stat"><b>NÍVEL</b><span id="hNivel">—</span></div>
    <div class="stat"><b>XP</b><div class="xpbar" aria-hidden="true"><i id="hXpBar"></i></div><span class="num" id="hXp">0</span></div>
    <div class="selos" id="hSelos"></div>
    <div class="spacer"></div>
    <button class="sec" id="btnVisao" type="button" aria-pressed="false">Mapa completo</button>
    <button class="sec" id="btnNiveis" type="button">Níveis</button>
    <button class="sec" id="btnFicha" type="button">Ficha</button>
    <button class="sec" id="btnSalvar" type="button">Salvar 💾</button>
    <button class="sec" id="btnSair" type="button">Sair</button>
    <button class="sec som" id="btnFx" type="button" aria-pressed="true">Efeitos: sim</button>
    <button class="sec som" id="btnMus" type="button" aria-pressed="true">Música: sim</button>
  </header>
  <div class="main">
    <div class="mapa px" id="mapa"><canvas id="cv" width="320" height="184" aria-label="Mapa do nível"></canvas></div>
    <aside class="diario px" aria-label="Diário de viagem">
      <h2 id="dTit">DIÁRIO DE VIAGEM</h2>
      <div class="dica">Clique num lugar brilhando no mapa (ou aqui na lista) para viajar.</div>
      <div id="lista" style="display:flex;flex-direction:column;gap:6px"></div>
    </aside>
  </div>
</div>
<div class="veu" id="veu" hidden><div class="cena px" id="cena" role="dialog" aria-modal="true"></div></div>
<div class="toast" id="toast" hidden></div>
<script>
// ===================== DADOS: ESCRITÓRIO PIXEL (gerado por conteudo/gerar_dados.py; não edite à mão) =====================
const CARDS = [{"t": "Layout da página", "p": ["A guia LAYOUT muda a página inteira: Margens, Orientação (Retrato = em pé; Paisagem = deitada), Tamanho (A4 é o padrão no Brasil) e Colunas.", "QUEBRAS: a Quebra de Página (Ctrl+Enter) começa uma página nova. A Quebra de Seção divide o documento em partes com configuração própria, por exemplo uma página em Paisagem no meio de um relatório em Retrato.", "Nunca use vários Enter para pular de página: qualquer mudança no texto desalinha tudo."], "ex": "o ofício para a prefeitura vai em A4, Retrato, margens de 2,5 cm; a tabela de preços larga fica numa seção em Paisagem."}, {"t": "Formatação de texto", "p": ["FONTE muda as letras: tipo, tamanho, cor, Negrito (Ctrl+N), Itálico (Ctrl+I) e Sublinhado (Ctrl+S). Atenção: no Office em português, Ctrl+B é SALVAR.", "PARÁGRAFO muda o bloco: alinhamento (Esquerda Ctrl+Q, Centralizar Ctrl+E, Direita Ctrl+G, Justificar Ctrl+J), recuos e espaçamento entre linhas.", "O PINCEL DE FORMATAÇÃO copia só a aparência de um texto para outro. Duplo clique no pincel aplica várias vezes."], "ex": "o título do comunicado é centralizado e em negrito; o corpo é justificado, com espaçamento 1,15."}, {"t": "Ortografia, gramática e idioma", "p": ["Sublinhado ondulado VERMELHO = possível erro de ortografia. AZUL (linha dupla) = gramática ou estilo. F7 revisa o documento inteiro.", "Nome próprio correto marcado como erro? Botão direito > Adicionar ao Dicionário.", "Texto colado da internet todo marcado? Pode estar com outro idioma de revisão: Revisão > Idioma > Definir Idioma de Revisão > Português (Brasil).", "O corretor não vê palavra certa no lugar errado (concerto x conserto). Sempre releia."], "ex": "antes de enviar a proposta, a equipe passa o F7 e lê em voz alta o texto final."}, {"t": "Elementos estruturais", "p": ["CABEÇALHO e RODAPÉ (Inserir) se repetem em todas as páginas: logo, nome da empresa, número de página.", "NÚMERO DE PÁGINA é automático: recalcula sozinho. NOTA DE RODAPÉ (Referências) explica um termo no pé da página, com numeração automática.", "TABELA (Inserir > Tabela) organiza dados em linhas e colunas. FOLHA DE ROSTO (Inserir) cria uma capa pronta."], "ex": "a proposta técnica tem capa, cabeçalho com o logo, rodapé com página X de Y e tabela de equipamentos."}, {"t": "Estilos", "p": ["ESTILO é formatação com significado: Normal (texto comum), Título 1 (capítulo), Título 2 (subtítulo).", "Para mudar TODOS os títulos de uma vez: botão direito no estilo > Modificar.", "Os estilos alimentam o PAINEL DE NAVEGAÇÃO (Exibir) e o SUMÁRIO automático. Formatar à mão (só negrito e fonte grande) não marca o texto como título."], "ex": "as 11 seções da proposta técnica estão em Título 1; os itens de cada seção, em Título 2."}, {"t": "Sumário automático", "p": ["Referências > Sumário cria a lista de títulos com as páginas, a partir dos estilos de Título.", "Mudou o texto? Referências > Atualizar Sumário > Atualizar o índice inteiro.", "Sumário vazio quase sempre quer dizer: os títulos não estão com estilo de Título. Em Sumário Personalizado você escolhe quantos níveis aparecem."], "ex": "o sumário da proposta é atualizado logo antes de exportar o PDF."}, {"t": "Conversão, importação e exportação", "p": [".docx é o formato do Word. .doc é o formato antigo (Word 97-2003), para quem tem versão velha.", "PDF: Arquivo > Salvar como (tipo PDF) ou Exportar > Criar PDF/XPS. Mantém a aparência e não é feito para edição. Guarde sempre o .docx para poder alterar.", "O Word abre PDF e converte em texto editável, mas o layout pode mudar: revise. Renomear .docx para .pdf NÃO converte o arquivo."], "ex": "a equipe envia Proposta_Tecnica_Comercial_Horizonte.pdf e guarda o .docx para a alteração surpresa."}, {"t": "Hard skills e soft skills", "p": ["HARD SKILLS são técnicas, aprendidas e comprováveis: Excel, digitação, idioma, operar um sistema.", "SOFT SKILLS são comportamentais: comunicação, trabalho em equipe, empatia, organização, gestão do tempo, ética, resiliência.", "Uma completa a outra. Em entrevista, mostre com um exemplo real: situação, o que você fez e o resultado."], "ex": "no Edital, montar a planilha usou hard skills; dividir tarefas e cumprir o prazo usou soft skills."}, {"t": "Pesquisa e fontes confiáveis", "p": ["Fonte confiável tem responsável identificado (instituição, autor), data e objetivo claro. Desconfie de páginas sem autor, posts virais e comentários.", "Confira em mais de uma fonte séria. Escreva com suas palavras: copiar e colar como seu é plágio.", "No documento, coloque o link completo (https://...) clicável (Inserir > Link) e, no fim, a lista de Fontes: título, quem publicou, link e data de acesso."], "ex": "a pesquisa sobre soft skills usa um site institucional e uma reportagem de veículo reconhecido, com links."}, {"t": "Fórmulas e operações", "p": ["Toda fórmula começa com = . Operadores: + soma, - subtração, * multiplicação, / divisão.", "Ordem: parênteses primeiro, depois * e /, depois + e -. =10+2*3 dá 16; =(10+2)*3 dá 36.", "A ALÇA DE PREENCHIMENTO (quadradinho no canto da célula) copia a fórmula para as linhas de baixo, ajustando as referências."], "ex": "Total do produto = Quantidade × Preço unitário: =B8*C8, arrastado para todos os itens do pedido."}, {"t": "SOMA, MÉDIA, MÍNIMO e MÁXIMO", "p": ["=SOMA(B2:B13) soma de B2 ATÉ B13. Os dois-pontos ( : ) indicam intervalo.", "No Excel em português, argumentos são separados por ponto e vírgula ( ; ), porque a vírgula é decimal.", "MÉDIA (com acento), MÍNIMO e MÁXIMO funcionam igual: =MÉDIA(B2:B13). Nome errado dá #NOME?."], "ex": "o resumo de vendas mostra total do ano, média mensal, pior mês e melhor mês de cada vendedor."}, {"t": "Porcentagem", "p": ["10% é o mesmo que 0,10. O formato Porcentagem só muda a aparência.", "Aumento: =preço*(1+10%). Desconto: =preço*(1-15%). Só o valor do desconto: =preço*15%.", "Percentual de uma meta: =realizado/meta, formatado em %."], "ex": "a margem de lucro da tabela de preços e o desconto da proposta do Edital usam porcentagem."}, {"t": "Referência absoluta ($)", "p": ["Referência RELATIVA (B7) muda quando a fórmula é copiada. ABSOLUTA ($B$7) fica fixa.", "Use $ quando todas as linhas dependem de UMA célula: cotação do dólar, margem, taxa.", "F4 alterna B7 → $B$7 → B$7 → $B7. O $ trava o que vem logo depois dele."], "ex": "=C10/$B$7 converte todos os preços para dólar usando a cotação fixa em B7."}, {"t": "ARRED, CONCATENAR e HOJE", "p": ["=ARRED(número;casas) arredonda de verdade o valor. O botão de casas decimais só muda a aparência.", "=CONCATENAR(A2;\" \";B2) junta textos; o & faz o mesmo: =A2&\" \"&B2.", "=HOJE() mostra a data atual e se atualiza sozinha. =AGORA() mostra data e hora."], "ex": "a parcela =ARRED(B2/3;2) e o código do pedido =CONCATENAR(\"PED-\";A2)."}, {"t": "Mensagens de erro", "p": ["#DIV/0! divisão por zero ou célula vazia. #NOME? nome de função errado (ex.: MEDIA sem acento).", "##### coluna estreita (o valor está certo). #N/D valor não encontrado (PROCV).", "#VALOR! tipo errado (texto numa conta). #REF! a fórmula aponta para célula que foi apagada."], "ex": "na revisão da planilha da proposta, cada erro é lido como pista do que consertar."}, {"t": "Função SE", "p": ["=SE(teste;valor se verdadeiro;valor se falso).", "Comparadores: > maior, < menor, >= maior ou igual, <= menor ou igual, = igual, <> diferente.", "Texto vai entre aspas: \"Aprovado\". \"\" (aspas sem nada) deixa a célula em branco."], "ex": "=SE(C2=\"Concluído\";D2*5%;0) calcula a comissão só das vendas concluídas."}, {"t": "E, OU e SE aninhado", "p": ["E(cond1;cond2) é verdadeiro se TODAS forem verdadeiras. OU(cond1;cond2) é verdadeiro se PELO MENOS UMA for.", "Use dentro do SE: =SE(E(B2>50000;C2<2);\"Bônus\";\"\").", "SE aninhado testa faixas: =SE(F2>=9;\"Ótimo\";SE(F2>=7;\"Bom\";\"Recuperação\")). Teste da maior faixa para a menor; feche um parêntese para cada SE."], "ex": "frete grátis =SE(OU(B2=\"VIP\";C2>300);0;25)."}, {"t": "CONT.SE e SOMASE", "p": ["=CONT.SE(intervalo;critério) CONTA quantas células atendem ao critério.", "=SOMASE(intervalo;critério;intervalo_soma) SOMA os valores das linhas que atendem ao critério.", "Critério com comparação vai entre aspas (\">1000\"). Critério pode ser uma célula (H2, sem aspas). Trave os intervalos com $ antes de arrastar."], "ex": "=SOMASE($B$2:$B$40;\"Transporte\";$C$2:$C$40) soma o gasto com transporte."}, {"t": "PROCV", "p": ["=PROCV(valor procurado;tabela;número da coluna;FALSO) procura o valor na PRIMEIRA coluna da tabela e traz a coluna pedida da mesma linha.", "FALSO = exato (códigos). VERDADEIRO = aproximado (faixas), com a primeira coluna em ordem crescente.", "Trave a tabela com $ e lembre: #N/D = não encontrou."], "ex": "digitando o código do equipamento, o PROCV traz o modelo e o preço da guia 01_PESQUISA."}, {"t": "Gráficos e dashboard", "p": ["Selecione os dados com os títulos e vá em Inserir > Gráficos.", "LINHA: evolução no tempo. COLUNAS: comparar categorias (Faturamento x Meta). PIZZA: partes de um todo, com poucas fatias.", "Todo gráfico precisa de título claro e unidade (R$, %). Dashboard = indicadores + gráficos numa tela só."], "ex": "a guia 04_EVOLUCAO tem um gráfico de linha de 2022 a 2026 e a 05_RESUMO uma pizza da composição do valor."}, {"t": "Organizar dados", "p": ["Dados > Classificar ordena as linhas inteiras. Dados > Filtro mostra só o que interessa, sem apagar.", "Formatação Condicional pinta sozinha (ex.: notas abaixo de 7 em vermelho) e acompanha a mudança dos valores.", "Exibir > Congelar Painéis deixa o cabeçalho visível. Guias com nome claro organizam a pasta de trabalho."], "ex": "a planilha da proposta tem guias 01 a 05, filtro na pesquisa e destaque nos itens fora do orçamento."}, {"t": "Outlook: conceitos e área de trabalho", "p": ["O Outlook reúne E-mail, Calendário, Pessoas (contatos) e Tarefas. A barra de navegação troca entre eles.", "Pastas padrão: Caixa de Entrada, Rascunhos (não enviados), Itens Enviados, Itens Excluídos, Lixo Eletrônico (spam) e Caixa de Saída.", "A Faixa de Opções tem os comandos (barras de menus e ferramentas). O Painel de Leitura mostra a mensagem selecionada."], "ex": "a assistente começa o dia pela Caixa de Entrada e confere o Lixo Eletrônico para não perder o e-mail da comissão."}, {"t": "Enviar, responder, cópias e anexos", "p": ["PARA: quem deve agir. CC: quem precisa saber (todos veem). CCO: cópia oculta, ninguém vê os outros endereços.", "RESPONDER vai só para quem enviou; RESPONDER A TODOS vai para todos; ENCAMINHAR manda para outra pessoa e leva os anexos.", "Anexar Arquivo (clipe). Arquivo grande (acima de 20 a 25 MB): mande o link do OneDrive/nuvem. Assunto claro e assinatura sempre."], "ex": "o protocolo vai Para a comissão, com Cc para o coordenador do grupo e três anexos."}, {"t": "Senhas e segurança", "p": ["Senha forte: longa, com letras, números e símbolos, só sua, diferente em cada serviço.", "Nunca passe a senha, nem para colega. Ative a autenticação em dois fatores (código no celular).", "PHISHING: e-mail falso com urgência, link e pedido de senha ou dados. Passe o mouse sobre o link para ver o endereço real, não clique e avise o TI."], "ex": "um e-mail \"do banco\" pedindo senha chegou ao financeiro: foi marcado como phishing e excluído."}, {"t": "Pastas, regras, filtros e pesquisa", "p": ["Crie PASTAS por assunto (Clientes, Financeiro, Edital) e arraste as mensagens.", "REGRAS movem sozinhas as mensagens (ex.: tudo do fornecedor Alfa → pasta Fornecedores).", "FILTRO mostra só Não Lidos, Com Anexos ou Sinalizados. A BANDEIRA cria lembrete de acompanhamento. A caixa PESQUISAR encontra por remetente, assunto ou palavra."], "ex": "os e-mails do Edital caem sozinhos na pasta Edital por uma regra."}, {"t": "Contatos e catálogo de endereços", "p": ["Em PESSOAS você cadastra contatos (nome, e-mail, telefone, empresa).", "O CATÁLOGO DE ENDEREÇOS da empresa (Lista Global) traz todos os colegas. GRUPO DE CONTATOS junta várias pessoas num nome só.", "Para passar contatos, compartilhe a pasta de contatos ou envie o contato por e-mail. Guarde só os dados pessoais necessários (LGPD)."], "ex": "o grupo \"Equipe Edital\" leva o e-mail para os 5 integrantes de uma vez."}, {"t": "Agenda, recursos e compartilhamento", "p": ["COMPROMISSO é só seu. REUNIÃO convida pessoas, que aceitam ou recusam. RECORRÊNCIA repete (toda segunda às 9h).", "RECURSOS: salas e equipamentos (projetor) entram no convite e ficam reservados. O ASSISTENTE DE AGENDAMENTO mostra quem está livre.", "COMPARTILHAR CALENDÁRIO: você escolhe a permissão (só disponibilidade, detalhes ou editar)."], "ex": "a defesa da proposta foi marcada como reunião, com a Sala 2 e o projetor como recursos."}, {"t": "PowerPoint: modos e layout", "p": ["Modos de exibição: Normal (editar), Classificação de Slides (reorganizar), Anotações, Leitura e Apresentação de Slides.", "Ctrl+M cria um slide. Página Inicial > Layout muda a organização das caixas.", "Exibir > SLIDE MESTRE é o modelo de todos os slides: logo, fontes e cores entram ali uma vez só. As Anotações são lembretes que o público não vê."], "ex": "o logo da Horizonte está no Slide Mestre e aparece nos 6 slides da defesa."}, {"t": "Figuras, objetos e boas práticas", "p": ["Inserir: Imagens, Formas, Ícones, SmartArt (diagramas prontos), Gráfico, Tabela e Vídeo.", "Alinhar > Distribuir deixa objetos com espaços iguais. Gráfico copiado do Excel mantém qualidade: confira os valores.", "Pouco texto, imagens e a paleta de 2 a 3 cores. Não use imagens de pessoas reais nem marcas existentes sem autorização."], "ex": "o slide 4 da defesa tem o gráfico de evolução colado do Excel e um SmartArt da implantação."}, {"t": "Transições, impressão e apresentação", "p": ["TRANSIÇÃO = efeito entre slides (Aplicar a Todos padroniza). ANIMAÇÃO = efeito em um objeto dentro do slide.", "Imprimir: Slides em página inteira, Anotações, Estrutura de Tópicos ou Folhetos (3 por página traz linhas para anotar).", "F5 começa do início; Shift+F5 do slide atual; Esc encerra. O Modo de Exibição do Apresentador mostra notas, cronômetro e próximo slide."], "ex": "a comissão recebeu folhetos de 3 slides por página para anotar durante a defesa."}, {"t": "Inteligência Artificial com senso crítico", "p": ["A IA ajuda a gerar ideias, textos e imagens, mas pode errar e inventar dados. Revise sempre: a responsabilidade é sua.", "Bom prompt tem contexto, público, quantidade, formato e tom.", "Não cole dados sigilosos ou pessoais em IA pública. Registre os prompts e o que você corrigiu. Dado sem fonte não entra no trabalho."], "ex": "no Novo Produto com IA, o slogan foi gerado com IA, adaptado pela aluna e registrado no Word."}, {"t": "A proposta do Edital", "p": ["Coerência: o valor total do Excel é o mesmo no Word, no PowerPoint e no e-mail.", "Versões: a alteração surpresa gera o v2 de todos os arquivos que mudam.", "Protocolo por e-mail: assunto \"Proposta Comercial - Edital Simulado 001/2026 - Nome da Empresa\", breve apresentação e os três anexos (PDF, .xlsx, .pptx)."], "ex": "a Horizonte entregou a proposta v2 com o mesmo total nos três arquivos."}, {"t": "Revisão: a planilha por dentro", "p": ["CÉLULA é o encontro de coluna e linha (B4). INTERVALO é um bloco de células (B2:B10). GUIA é cada planilha; o arquivo .xlsx inteiro é a PASTA DE TRABALHO.", "Formatos de número (Moeda, Contábil, Porcentagem, Data) mudam só a aparência: o valor continua número e entra nas contas.", "Mesclar e Centralizar une células para títulos. Clique no + ao lado das guias para criar uma nova e dê duplo clique no nome para renomear."], "ex": "a pasta Proposta_Comercial_Horizonte.xlsx tem as guias 01_PESQUISA a 05_RESUMO e todos os valores em Moeda."}, {"t": "Recursos que fazem a diferença", "p": ["FORMATAR COMO TABELA: filtro nos títulos, linhas alternadas e a tabela cresce sozinha.", "VALIDAÇÃO DE DADOS (guia Dados) cria listas suspensas e impede digitação errada. TABELA DINÂMICA (Inserir) resume centenas de linhas arrastando campos.", "PROTEGER PLANILHA (Revisão) guarda as fórmulas; antes, desbloqueie as células que podem ser preenchidas. QUEBRAR TEXTO mostra textos longos dentro da célula."], "ex": "a coluna Status tem lista suspensa e a guia 05_RESUMO está protegida."}, {"t": "Imprimir e entregar a planilha", "p": ["Arquivo > Imprimir mostra a visualização antes de gastar papel.", "Layout da Página: Orientação (Paisagem para planilhas largas), Área de Impressão, Imprimir Títulos (repetir o cabeçalho) e Ajustar para 1 página de largura.", "Congelar Painéis vale só na tela; para o papel use Imprimir Títulos."], "ex": "cada guia da proposta cabe em 1 página de largura, com o cabeçalho repetido."}, {"t": "Apresentar com segurança", "p": ["Ensaie em voz alta, com cronômetro, e divida as falas da equipe.", "Olhe para o público; o slide é apoio, não roteiro para ler. Comece pelo problema e termine com a chamada para ação.", "Não sabe responder? Seja honesto e combine o retorno por e-mail. Informação inventada derruba a credibilidade."], "ex": "a defesa da Horizonte foi ensaiada 2 vezes e coube em 7 minutos e meio."}, {"t": "Mestre Final • Word", "p": ["Página: Layout (margens, orientação, quebras de página e de seção). Texto: Fonte e Parágrafo, Pincel de Formatação.", "Revisão: F7, sublinhado vermelho (ortografia) e azul (gramática), idioma de revisão. Estrutura: cabeçalho, rodapé, número de página, tabela, nota de rodapé, capa.", "Estilos (Título 1, Título 2) → Painel de Navegação e Sumário (atualizar no fim). Entrega: Salvar como PDF, guardando o .docx."], "ex": "a proposta técnica passou por estilos, sumário, revisão e PDF."}, {"t": "Mestre Final • Competências", "p": ["Hard skill = técnica comprovável. Soft skill = comportamento. Mostre as duas com exemplos reais.", "Fonte confiável: quem publicou, data, link completo. Escreva com suas palavras e cite.", "IA: bom prompt, revisão crítica, nada de dados sigilosos, nenhum número sem fonte."], "ex": "o grupo citou as fontes da pesquisa e registrou os prompts usados."}, {"t": "Mestre Final • Excel: contas e decisões", "p": ["Fórmula começa com = ; em português, ; separa argumentos e : indica intervalo.", "Porcentagem: aumento *(1+x%), desconto *(1-x%). Referência absoluta com $ (F4).", "SE, E, OU, SE aninhado, CONT.SE e SOMASE (um critério), CONT.SES (vários critérios)."], "ex": "o total de cada item da proposta usa quantidade, preço e desconto travado com $."}, {"t": "Mestre Final • Excel: busca, gráficos e entrega", "p": ["PROCV exato (FALSO) e por faixas (VERDADEIRO, primeira coluna crescente). #N/D = não encontrou; confira espaços sobrando (ARRUMAR).", "Gráfico ligado às células se atualiza sozinho: linha para tempo, colunas para comparar, pizza para composição.", "Validação e proteção evitam erros; área de impressão e ajuste de página deixam a entrega pronta."], "ex": "a guia 05_RESUMO tem o gráfico de evolução e está pronta para imprimir."}, {"t": "Mestre Final • Outlook", "p": ["Para (age), Cc (acompanha), Cco (oculto). Responder não leva anexos; Encaminhar leva.", "Arquivo grande: link do OneDrive. Senha só sua, MFA ligado, desconfie de urgência + link + pedido de dados.", "Pastas + regras + bandeiras organizam. Reunião com recursos e recorrência; compartilhe o calendário com a permissão certa."], "ex": "a equipe marcou a defesa com a Sala 2 e o projetor e protocolou a proposta no prazo."}, {"t": "Mestre Final • PowerPoint", "p": ["Slide Mestre padroniza; Layout organiza; Classificação de Slides reordena; Anotações guardam a sua fala.", "Pouco texto, gráficos coerentes com o Excel, SmartArt para processos, imagens com direito de uso.", "Transição entre slides, animação nos objetos. F5 do início, Shift+F5 do slide atual. Folhetos de 3 por página para a comissão anotar."], "ex": "os 6 slides da defesa seguem o mestre da Horizonte e o total é o mesmo da planilha."}];
const LEVELS = [{"id": "facil", "nome": "Fase 1", "titulo": "O Vale dos Documentos", "aula": "Encontro 1 • Word e competências profissionais", "bioma": "campo", "codigo": null, "ind": "Word (layout, formatação, revisão, estrutura, estilos, PDF) • Hard e soft skills • Fontes confiáveis", "fases": [{"nome": "Vila da Página", "hist": [{"q": "Narrador", "c": "#c9b28a", "cena": "escritorio", "t": "Na cidade de Pixelândia fica a Horizonte Distribuidora, empresa de equipamentos de tecnologia. Ela vai disputar o Edital Simulado 001/2026: fornecer computadores, TVs e impressoras para 8 escolas."}, {"q": "Gerente Célia", "c": "#e63946", "cena": "vilao", "t": "Desastre! O vírus Barão Bagunça invadiu a rede: desformatou os documentos, quebrou as fórmulas, embaralhou os e-mails e apagou os slides. A entrega é em 3 dias!"}, {"q": "Gerente Célia", "c": "#e63946", "cena": "word", "t": "Você é a nova pessoa da equipe e já fez o curso de Office. Primeira missão: salvar os documentos do Word. Comece pela página: margens, orientação e texto."}, {"q": "Robô Bit", "c": "#8d99ae", "cena": "robo", "t": "Olá! Eu sou o Bit, estagiário. Faço exatamente o que mandam, nem mais nem menos. Por isso, preciso que você saiba o comando certo!"}, {"q": "Narrador", "c": "#c9b28a", "cena": "mapa", "t": "Como jogar: clique nos lugares que brilham. Antes de cada batalha há um PERGAMINHO com a teoria. Errou? Perde 1 vida e lê a explicação de por que a resposta não serve. A pergunta volta no fim."}], "lugares": {"vila": {"nome": "Sala das Margens", "ic": "vila", "tipo": "batalha", "card": 0, "npc": "Gerente Célia", "npcCor": "#e63946", "fala": "O Fantasma Torto entortou as páginas do ofício. Mostre que você domina a guia Layout.", "inimigo": ["Fantasma Torto", "#e0fbfc", "#7b2ff7"], "qs": "layout", "ind": [1], "x": 50, "y": 50}, "atelie": {"nome": "Ateliê da Fonte", "ic": "atelie", "tipo": "batalha", "card": 1, "npc": "Gerente Célia", "npcCor": "#e63946", "fala": "A Gosma Sem Formato apagou negritos e alinh mento."]}, {"q": "Você acrescentou páginas e o sumário ficou com números de página errados. O que fazer?", "o": ["Referências > Atualizar Sumário (atualizar a tabela inteira)", "Apagar e digitar os números certos", "Nada, o PDF corrige", "Inserir um sumário novo embaixo do antigo"], "c": 0, "e": "Atualizar Sumário > Atualizar o índice inteiro traz títulos e páginas novos.", "w": ["Número digitado à mão fica errado de novo na próxima mudança.", "O PDF copia o que está no Word, inclusive o erro.", "Fica com dois sumários, um deles errado."]}, {"q": "Para o sumário mostrar SÓ os capítulos (sem subtítulos), o que se ajusta?", "o": ["Em Sumário Personalizado, mostrar só 1 nível", "Apagar todos os subtítulos", "Trocar a fonte do sumário", "Colocar o sumário no rodapé"], "c": 0, "e": "Em Referências > Sumário > Sumário Personalizado, a opção Mostrar níveis define quantos níveis de título entram.", "w": ["Os subtítulos continuam úteis no texto; basta não listá-los.", "Fonte é só aparência.", "Rodapé não é lugar de sumário."]}, {"q": "Em que ordem montar um relatório profissional para o sumário funcionar?", "o": ["Aplicar estilos nos títulos → inserir o sumário → atualizar ao final", "Inserir o sumário → digitar os números → formatar", "Exportar para PDF → inserir sumário", "Fazer o sumário em outro arquivo"], "c": 0, "e": "Primeiro os estilos; o sumário nasce deles; no fim, atualize para pegar as páginas finais.", "w": ["Número digitado não acompanha o texto.", "No PDF não se edita mais o sumário.", "Em outro arquivo ele não acompanha as páginas."]}], "exportar": [{"q": "Você precisa mandar a proposta para a comissão SEM que ela altere o texto e com a aparência garantida. Qual formato?", "o": ["PDF", "DOCX", "TXT", "RTF"], "c": 0, "e": "O PDF mantém a aparência igual em qualquer computador e não é feito para edição.", "w": ["DOCX é o formato editável do Word.", "TXT perde toda a formatação.", "RTF é editável e pode mudar a aparência."]}, {"q": "Como gerar um PDF a partir do Word?", "o": ["Arquivo > Salvar como (ou Exportar) e escolher PDF", "Renomear o arquivo de .docx para .pdf", "Imprimir em papel e escanear", "Copiar o texto para o Bloco de Notas"], "c": 0, "e": "Salvar como > tipo PDF, ou Arquivo > Exportar > Criar PDF/XPS. O .docx original continua guardado para editar.", "w": ["Mudar a extensão no nome não converte: o arquivo fica corrompido.", "Escanear dá trabalho e perde qualidade e texto pesquisável.", "O Bloco de Notas perde a formatação."]}, {"q": "Qual é a extensão padrão de um documento do Word atual?", "o": [".docx", ".xlsx", ".pptx", ".pdf"], "c": 0, "e": ".docx é o Word. .xlsx é Excel e .pptx é PowerPoint.", "w": [".xlsx é planilha do Excel.", ".pptx é apresentação do PowerPoint.", ".pdf é o formato de documento fixo, não o do Word."]}, {"q": "Você abriu um PDF no Word para editar. O que pode acontecer?", "o": ["O Word converte para texto editável, mas o layout pode mudar e precisa de revisão", "Nada abre: o Word não lê PDF", "O PDF original é apagado", "O texto vira imagem que não se edita"], "c": 0, "e": "O Word converte o PDF em documento editável. Tabelas e imagens podem sair do lugar: confira antes de usar.", "w": ["O Word atual abre PDF, convertendo.", "O PDF original continua no computador.", "Ele tenta transformar em texto editável, não em imagem."]}, {"q": "O colega usa um Word muito antigo e não abre seu .docx. Uma saída é:", "o": ["Salvar uma cópia como Documento do Word 97-2003 (.doc)", "Mandar o arquivo em .xlsx", "Mandar a pasta inteira compactada sem o arquivo", "Mudar a fonte para Arial"], "c": 0, "e": "O .doc é o formato antigo, compatível com versões velhas. Alguns recursos novos podem se perder.", "w": [".xlsx é planilha, ele nem abriria no Word.", "Sem o arquivo não há o que abrir.", "Fonte não resolve compatibilidade de formato."]}], "skills": [{"q": "O que são HARD SKILLS?", "o": ["Habilidades técnicas, que se aprendem e se comprovam (ex.: usar Excel, digitar, falar inglês)", "Habilidades de comportamento, como empatia", "Habilidades só de quem trabalha com computador", "Defeitos que o profissional precisa esconder"], "c": 0, "e": "Hard skills são técnicas e mensuráveis: dá para aprender em curso e mostrar em teste ou certificado.", "w": ["Empatia é comportamento: é soft skill.", "Toda profissão tem hard skills (cozinhar, dirigir, vender).", "Não são defeitos: são competências técnicas."]}, {"q": "Qual destas é uma SOFT SKILL?", "o": ["Comunicação clara com clientes e colegas", "Criar fórmulas com PROCV", "Configurar margens no Word", "Digitar 50 palavras por minuto"], "c": 0, "e": "Soft skills são comportamentais: comunicação, trabalho em equipe, empatia, organização, resiliência.", "w": ["PROCV é técnica de Excel: hard skill.", "Configurar margem é técnica de Word: hard skill.", "Velocidade de digitação se mede: hard skill."]}, {"q": "Na empresa, o mais completo é o profissional que:", "o": ["Combina hard skills (fazer bem a tarefa) com soft skills (trabalhar bem com as pessoas)", "Só tem hard skills, porque comportamento não importa", "Só tem soft skills, porque técnica se aprende depois", "Esconde as dificuldades para não parecer fraco"], "c": 0, "e": "As duas se completam: a técnica faz a entrega; o comportamento faz a entrega chegar no prazo, em equipe e com qualidade.", "w": ["Muitas demissões acontecem por comportamento, não por falta de técnica.", "Sem técnica não há entrega.", "Pedir ajuda e dizer o que não sabe também é soft skill."]}, {"q": "No Edital, o grupo dividiu tarefas, cumpriu o prazo e resolveu um conflito conversando. Isso mostra principalmente:", "o": ["Soft skills: colaboração, gestão do tempo e comunicação", "Hard skills de Excel", "Hard skills de PowerPoint", "Nenhuma competência"], "c": 0, "e": "Dividir tarefas, cumprir prazo e negociar são comportamentos: soft skills.", "w": ["Excel aparece na planilha, não na forma de se organizar em equipe.", "PowerPoint aparece nos slides, não no jeito de resolver o conflito.", "Essas atitudes são muito valorizadas pelas empresas."]}, {"q": "Como mostrar uma soft skill em uma entrevista de emprego?", "o": ["Contando um exemplo real: situação, o que você fez e o resultado", "Dizendo só \"sou comunicativo\"", "Mostrando um certificado de Excel", "Falando mal do emprego anterior"], "c": 0, "e": "Exemplo concreto convence: \"No projeto X, organizei a equipe e entregamos antes do prazo\".", "w": ["Sem exemplo, é só opinião sobre si mesmo.", "Certificado de Excel comprova hard skill.", "Falar mal mostra falta de ética, uma soft skill negativa."]}], "fontes": [{"q": "Qual destas fontes é MAIS confiável para a pesquisa sobre soft skills?", "o": ["Site de uma instituição reconhecida (universidade, órgão público, Senac), com autor e data", "Um vídeo curto viral sem autor", "Um comentário em rede social", "Um blog anônimo cheio de anúncios"], "c": 0, "e": "Fonte confiável tem responsável identificado, data, objetivo claro e, de preferência, referências.", "w": ["Viral não quer dizer verdadeiro.", "Comentário é opinião de uma pessoa.", "Sem autor, não dá para saber quem garante a informação."]}, {"q": "Para colocar o link da fonte no documento do Word de forma clicável:", "o": ["Selecionar o texto e usar Inserir > Link, colando o endereço completo", "Escrever só \"fonte: internet\"", "Colocar só o nome do site, sem o endereço", "Tirar um print da tela do navegador"], "c": 0, "e": "O link completo (com https://) deixa qualquer leitor conferir a fonte com um clique.", "w": ["\"Internet\" não é fonte: não diz onde está a informação.", "Sem endereço, o leitor não acha a página.", "Print não é clicável e não mostra o endereço certo."]}, {"q": "Copiar um texto da internet e colar no seu trabalho como se fosse seu é:", "o": ["Plágio: é preciso escrever com suas palavras e citar a fonte", "Normal, porque está na internet", "Permitido se mudar a fonte da letra", "Pesquisa bem-feita"], "c": 0, "e": "Use a fonte para aprender, escreva com suas palavras e coloque a referência com o link.", "w": ["Estar publicado não dá direito de copiar como seu.", "Mudar a letra não muda a autoria.", "Pesquisa bem-feita cita de onde veio cada informação."]}, {"q": "O que ajuda a conferir se uma informação da internet é verdadeira?", "o": ["Comparar com outras fontes confiáveis e ver a data da publicação", "Ver se tem muitas curtidas", "Ver se o título é chamativo", "Confiar no primeiro resultado da busca"], "c": 0, "e": "Checagem cruzada: se fontes sérias e atuais dizem o mesmo, a chance de estar certo é bem maior.", "w": ["Curtida mede popularidade, não verdade.", "Título chamativo muitas vezes é isca de clique.", "O primeiro resultado pode ser anúncio ou página antiga."]}, {"q": "No fim do documento de pesquisa, a parte \"Fontes\" deve ter:", "o": ["Título da página, quem publicou, link completo e data de acesso", "Só a palavra Google", "O nome do professor", "A senha do seu e-mail"], "c": 0, "e": "Com esses dados, qualquer pessoa encontra e confere a página que você usou.", "w": ["Google é o buscador, não a fonte.", "O professor não é a fonte da pesquisa.", "Senha nunca vai em documento."]}], "operacoes": [{"q": "Toda fórmula no Excel começa com:", "o": ["= (sinal de igual)", "+ (sinal de mais)", "# (cerquilha)", "( (parêntese)"], "c": 0, "e": "O = avisa o Excel que vem um cálculo. Sem ele, o que você digita vira texto.", "w": ["O + até é aceito (o Excel coloca o = na frente), mas o padrão é começar com =.", "# aparece em mensagens de erro, como #DIV/0!.", "Parêntese agrupa contas dentro da fórmula, não a inicia."]}, {"q": "Na Papelaria Ponto Certo, B8 é a Quantidade e C8 o Preço unitário. Qual fórmula dá o Total do produto?", "o": ["=B8*C8", "=B8+C8", "=B8xC8", "B8*C8"], "c": 0, "e": "Multiplicação no Excel é o asterisco (*). Total = Quantidade × Preço.", "w": ["+ soma quantidade com preço: não faz sentido.", "x não é operador no Excel: dá erro #NOME?.", "Sem o = no começo, o Excel mostra o texto B8*C8."]}, {"q": "Quanto o Excel calcula em =10+2*3 ?", "o": ["16", "36", "15", "Dá erro"], "c": 0, "e": "Multiplicação e divisão vêm antes de soma e subtração: 2*3=6; 10+6=16.", "w": ["36 seria (10+2)*3: só com parênteses.", "15 não sai de nenhuma ordem dessas contas.", "A fórmula está correta."]}, {"q": "Você escreveu a fórmula do Total na primeira linha. Como copiar para as linhas de baixo?", "o": ["Arrastar a alça de preenchimento (o quadradinho no canto da célula)", "Digitar a fórmula de novo em cada linha", "Copiar só o resultado e colar", "Apertar F7"], "c": 0, "e": "A alça copia a fórmula ajustando as linhas sozinha: B8*C8 vira B9*C9, B10*C10...", "w": ["Funciona, mas é lento e é fácil errar.", "Colar só o valor copia o número, não a conta.", "F7 é verificação de ortografia."]}, {"q": "Para calcular o Total com frete (E8 = Total produtos, D8 = Frete), a fórmula é:", "o": ["=E8+D8", "=E8*D8", "=SOMA(E8*D8)", "=E8-D8"], "c": 0, "e": "Total com frete = Total dos produtos + Frete.", "w": ["Multiplicar pelo frete não faz sentido.", "SOMA de uma multiplicação continua multiplicando.", "Subtrair tiraria o frete em vez de somar."]}], "funcoes": [{"q": "Qual fórmula soma as vendas de B2 até B13?", "o": ["=SOMA(B2:B13)", "=SOMA(B2;B13)", "=SOMA(B2-B13)", "=B2:B13"], "c": 0, "e": "Os dois-pontos ( : ) querem dizer \"até\": de B2 até B13, todas as células.", "w": ["Com ponto e vírgula, soma SÓ B2 e B13 (duas células).", "B2-B13 faz uma subtração e soma o resultado.", "Intervalo sozinho sem função não soma."]}, {"q": "No Excel em português, o que separa os ARGUMENTOS de uma função?", "o": ["; (ponto e vírgula)", ", (vírgula)", ": (dois-pontos)", "- (hífen)"], "c": 0, "e": "Em português a vírgula é usada nos decimais, então os argumentos são separados por ponto e vírgula: =SE(A1>7;\"Sim\";\"Não\").", "w": ["A vírgula é o separador decimal no Brasil (3,5).", "Dois-pontos indicam intervalo (B2:B13).", "Hífen é sinal de menos."]}, {"q": "Qual função mostra a MAIOR venda do mês?", "o": ["MÁXIMO", "MÍNIMO", "MÉDIA", "SOMA"], "c": 0, "e": "MÁXIMO devolve o maior valor do intervalo.", "w": ["MÍNIMO devolve o menor.", "MÉDIA divide a soma pela quantidade.", "SOMA soma tudo."]}, {"q": "As notas são 6, 8 e 10. Quanto dá =MÉDIA(...) dessas três?", "o": ["8", "24", "10", "6"], "c": 0, "e": "Média = (6+8+10)/3 = 24/3 = 8.", "w": ["24 é a SOMA, não a média.", "10 é o MÁXIMO.", "6 é o MÍNIMO."]}, {"q": "Você digitou =MEDIA(B2:B6) sem acento e apareceu #NOME?. Por quê?", "o": ["O nome da função está errado: no Excel em português é MÉDIA, com acento", "Faltou o sinal de =", "O intervalo está vazio", "A coluna está estreita"], "c": 0, "e": "#NOME? = o Excel não reconheceu o nome da função. Dica: comece a digitar e escolha da lista que aparece.", "w": ["O = está lá; senão nem seria fórmula.", "Intervalo vazio daria #DIV/0!, não #NOME?.", "Coluna estreita mostra #####."]}], "porcento": [{"q": "O produto custa R$ 200,00 e terá aumento de 10%. Qual fórmula dá o NOVO preço (B2 = 200)?", "o": ["=B2*(1+10%)", "=B2*10%", "=B2+10", "=B2/10%"], "c": 0, "e": "Novo preço = preço + 10% do preço = preço × 1,10 = 220.", "w": ["B2*10% dá só o valor do aumento (20), não o novo preço.", "Soma 10 reais, não 10%.", "Dividir por 10% multiplica por 10 (2.000)."]}, {"q": "Um desconto de 15% sobre R$ 80,00 (B2) deixa o preço final em:", "o": ["=B2*(1-15%) → R$ 68,00", "=B2-15 → R$ 65,00", "=B2*15% → R$ 12,00", "=B2*(1+15%) → R$ 92,00"], "c": 0, "e": "Preço com desconto = preço × (1 − 15%) = 80 × 0,85 = 68.", "w": ["Tira 15 reais, não 15%.", "12 é o valor do desconto, não o preço final.", "Esse é o preço com AUMENTO de 15%."]}, {"q": "A célula mostra 0,25. Para ver 25%, você deve:", "o": ["Aplicar o formato Porcentagem (%) na célula", "Multiplicar por 100 e digitar o %", "Apagar e digitar \"25%\" como texto entre aspas", "Mudar a fonte"], "c": 0, "e": "0,25 e 25% são o mesmo número; o formato Porcentagem só muda a aparência.", "w": ["Multiplicar por 100 e formatar daria 2500%.", "Texto entre aspas não entra em conta.", "Fonte não muda formato de número."]}, {"q": "O vendedor bateu R$ 12.000 de uma meta de R$ 10.000. Qual fórmula mostra o % da meta (B2 = vendas, C2 = meta)?", "o": ["=B2/C2 (formatado em %)", "=C2/B2", "=B2-C2", "=B2*C2"], "c": 0, "e": "% da meta = realizado ÷ meta = 1,2 → 120%.", "w": ["Invertido: daria 83%.", "Mostra a diferença em reais (2.000), não o percentual.", "Multiplicar não tem sentido aqui."]}, {"q": "O INSS do funcionário é 9% do salário (B2). Qual é o salário líquido só com esse desconto?", "o": ["=B2-B2*9%", "=B2*9%", "=B2+B2*9%", "=9%-B2"], "c": 0, "e": "Líquido = salário − desconto = salário − salário × 9%.", "w": ["Essa fórmula dá só o desconto.", "Somar o desconto aumentaria o salário.", "A ordem está trocada: o resultado seria negativo."]}], "absoluta": [{"q": "O dólar está em B7. Ao arrastar =C10/B7 para baixo, as linhas seguintes deram erro. Como corrigir?", "o": ["Travar a célula do dólar: =C10/$B$7", "Trocar por =C10/B8", "Digitar o valor do dólar em todas as linhas", "Usar =SOMA(C10/B7)"], "c": 0, "e": "Ao arrastar, B7 vira B8, B9... (vazias). O $ trava linha e coluna: $B$7 fica fixo.", "w": ["B8 continua mudando ao arrastar, e está vazia.", "Quando o dólar mudar, você terá que trocar tudo à mão.", "SOMA não trava a referência."]}, {"q": "Qual tecla alterna entre B7, $B$7, B$7 e $B7 enquanto você edita a fórmula?", "o": ["F4", "F2", "F7", "F12"], "c": 0, "e": "Clique na referência dentro da fórmula e aperte F4 até aparecer $B$7.", "w": ["F2 entra em modo de edição da célula.", "F7 é ortografia.", "F12 é Salvar Como."]}, {"q": "O que significa referência RELATIVA (ex.: B2)?", "o": ["Ela muda conforme a fórmula é copiada para outras linhas ou colunas", "Ela nunca muda", "Ela só funciona em outra planilha", "Ela é sempre um texto"], "c": 0, "e": "Relativa é o padrão: a fórmula copiada aponta para a célula na mesma posição relativa.", "w": ["Quem nunca muda é a absoluta ($B$2).", "Funciona na mesma planilha normalmente.", "É uma referência a célula, não um texto."]}, {"q": "A margem de lucro de 30% está em B3. Qual fórmula de preço de venda pode ser arrastada para todos os produtos (custo em C6)?", "o": ["=C6*(1+$B$3)", "=C6*(1+B3)", "=C6+30", "=$C$6*(1+B3)"], "c": 0, "e": "O custo muda por linha (C6 relativo); a margem é fixa ($B$3 absoluto).", "w": ["Ao arrastar, B3 vira B4, B5... e a margem some.", "Soma 30 reais, não 30%.", "Travou o custo (todas as linhas usariam C6) e soltou a margem."]}, {"q": "Em $B7 (com $ só antes do B), o que fica travado?", "o": ["Só a coluna B", "Só a linha 7", "A linha e a coluna", "Nada"], "c": 0, "e": "O $ trava o que vem logo depois dele: $B = coluna travada; a linha 7 muda.", "w": ["Para travar só a linha seria B$7.", "Para travar as duas seria $B$7.", "O $ trava a coluna."]}], "arred": [{"q": "A compra de R$ 100,00 em 3 parcelas mostra 33,3333333. Qual fórmula arredonda a parcela para 2 casas?", "o": ["=ARRED(B2/3;2)", "=ARRED(B2/3)", "=B2/3,2", "=ARRED(2;B2/3)"], "c": 0, "e": "ARRED(número; casas decimais). Fica 33,33.", "w": ["ARRED precisa dizer quantas casas.", "\"/3,2\" divide por 3,2.", "A ordem dos argumentos está invertida."]}, {"q": "Qual a diferença entre ARRED e o botão \"Diminuir Casas Decimais\"?", "o": ["ARRED muda o valor usado nas contas; o botão só muda a aparência", "Nenhuma", "O botão arredonda o valor de verdade e ARRED só a aparência", "ARRED só funciona com dinheiro"], "c": 0, "e": "Com o botão, o Excel continua guardando 33,3333... e as somas podem dar centavos de diferença. ARRED guarda 33,33.", "w": ["A diferença aparece nas somas de centavos.", "É o contrário.", "ARRED funciona com qualquer número."]}, {"q": "Nome em A2 (\"Ana\") e sobrenome em B2 (\"Souza\"). Qual fórmula mostra \"Ana Souza\"?", "o": ["=CONCATENAR(A2;\" \";B2)", "=CONCATENAR(A2;B2)", "=A2+B2", "=SOMA(A2;B2)"], "c": 0, "e": "CONCATENAR junta textos. O \" \" é o espaço entre nome e sobrenome. Também vale =A2&\" \"&B2.", "w": ["Sem o espaço sai \"AnaSouza\".", "+ é para números: com texto dá #VALOR!.", "SOMA é para números."]}, {"q": "Qual função mostra a data de HOJE e se atualiza sozinha a cada dia?", "o": ["=HOJE()", "=DATA()", "=AGORA(2026)", "=DIA()"], "c": 0, "e": "HOJE() não tem argumentos e devolve a data atual. AGORA() devolve data e hora.", "w": ["DATA(ano;mês;dia) monta uma data fixa.", "AGORA não recebe argumentos.", "DIA(data) extrai o dia de uma data."]}, {"q": "Qual operador também junta textos, como o CONCATENAR?", "o": ["& (e comercial)", "+ (mais)", "* (asterisco)", "# (cerquilha)"], "c": 0, "e": "=A2&\" \"&B2 junta como o CONCATENAR.", "w": ["+ soma números.", "* multiplica.", "# não é operador."]}], "erros": [{"q": "A célula mostra #DIV/0!. O que aconteceu?", "o": ["A fórmula dividiu por zero ou por uma célula vazia", "O nome da função está errado", "A coluna está estreita", "A planilha foi apagada"], "c": 0, "e": "Divisão por zero não existe. Confira a célula do divisor (ex.: o dólar ou a quantidade).", "w": ["Nome errado mostra #NOME?.", "Coluna estreita mostra #####.", "Planilha apagada não mostra erro na célula."]}, {"q": "A célula mostra ##### com um número dentro. O que fazer?", "o": ["Alargar a coluna (duplo clique na divisa do cabeçalho)", "Refazer a fórmula", "Apagar a célula", "Mudar para porcentagem"], "c": 0, "e": "##### quer dizer que o número não cabe na largura da coluna. O valor está certo.", "w": ["A fórmula está certa; só não cabe.", "Apagar perde o dado.", "Porcentagem não resolve a largura."]}, {"q": "O PROCV mostra #N/D. O motivo mais comum é:", "o": ["O valor procurado não existe na primeira coluna da tabela", "A tabela tem muitas linhas", "A fonte está pequena", "Faltou negrito"], "c": 0, "e": "#N/D = não disponível: o código procurado não foi encontrado (às vezes por um espaço a mais).", "w": ["Tabela grande funciona normalmente.", "Fonte não muda cálculo.", "Negrito não muda cálculo."]}, {"q": "Você somou um número com um texto (=A2+B2, com B2 = \"dez\"). O erro será:", "o": ["#VALOR!", "#DIV/0!", "#####", "#REF!"], "c": 0, "e": "#VALOR! aparece quando a conta recebe um tipo errado, como texto no lugar de número.", "w": ["#DIV/0! é divisão por zero.", "##### é coluna estreita.", "#REF! é referência que deixou de existir."]}, {"q": "Você apagou uma coluna que uma fórmula usava, e apareceu #REF!. Por quê?", "o": ["A fórmula aponta para uma célula que não existe mais", "O Excel travou", "Faltou o $ na fórmula", "O nome da função tem acento"], "c": 0, "e": "#REF! = referência inválida. Desfaça (Ctrl+Z) ou refaça a fórmula apontando para a célula certa.", "w": ["O Excel está funcionando; o problema é a referência.", "O $ não impede o #REF! quando a coluna é apagada.", "Acento correto não dá erro."]}], "se": [{"q": "Qual fórmula mostra \"Aprovado\" se a média (F2) for maior ou igual a 7 e \"Reprovado\" se não?", "o": ["=SE(F2>=7;\"Aprovado\";\"Reprovado\")", "=SE(F2>=7;Aprovado;Reprovado)", "=SE(F2=>7;\"Aprovado\";\"Reprovado\")", "=SE(\"Aprovado\";F2>=7;\"Reprovado\")"], "c": 0, "e": "SE(teste; valor se verdadeiro; valor se falso). Texto vai sempre entre aspas.", "w": ["Sem aspas, o Excel procura nomes Aprovado/Reprovado e dá #NOME?.", "O sinal certo é >= (maior ou igual), nessa ordem.", "A ordem é teste primeiro, depois os resultados."]}, {"q": "Reajuste: quem ganha menos de R$ 2.000 (B2) recebe 10%; os demais, 5%. Qual fórmula dá o novo salário?", "o": ["=SE(B2<2000;B2*1,1;B2*1,05)", "=SE(B2<2000;10%;5%)", "=SE(B2>2000;B2*1,1;B2*1,05)", "=B2*1,1"], "c": 0, "e": "Testa a faixa e já calcula o salário com o percentual certo.", "w": ["Mostra só o percentual, não o novo salário.", "Inverteu: quem ganha MAIS levaria 10%.", "Dá 10% para todos, sem testar nada."]}, {"q": "Qual sinal significa DIFERENTE no Excel?", "o": ["<>", "!=", "=/=", "><"], "c": 0, "e": "No Excel, diferente é <> (menor e maior juntos).", "w": ["!= é usado em programação, não no Excel.", "=/= não existe no Excel.", "A ordem certa é <>."]}, {"q": "Em =SE(C2=\"Concluído\";D2*5%;0), o que acontece quando o status NÃO é \"Concluído\"?", "o": ["A comissão fica 0", "A comissão fica 5%", "Dá erro", "Mostra \"Concluído\""], "c": 0, "e": "O terceiro argumento é o resultado quando o teste é falso: 0.", "w": ["5% de D2 só quando o teste é verdadeiro.", "A fórmula está correta.", "Ela mostra o número, não o status."]}, {"q": "Você quer que o SE mostre a célula VAZIA quando o teste for falso. O terceiro argumento é:", "o": ["\"\" (duas aspas sem nada dentro)", "0", "VAZIO", "\" \" (aspas com espaço)"], "c": 0, "e": "\"\" é um texto vazio: a célula parece em branco.", "w": ["0 mostra o número zero.", "VAZIO sem aspas dá #NOME?.", "Com espaço a célula tem um caractere, e pode atrapalhar CONT.SE e PROCV."]}], "eou": [{"q": "Bônus só para quem vendeu mais de 50 mil E teve menos de 2 faltas. Qual teste usar no SE?", "o": ["E(B2>50000;C2<2)", "OU(B2>50000;C2<2)", "E(B2>50000)", "B2>50000;C2<2"], "c": 0, "e": "E(...) só é VERDADEIRO quando TODAS as condições são verdadeiras.", "w": ["OU aceita quem cumpriu só uma das condições.", "Ficou faltando a condição das faltas.", "Sem a função E, o SE recebe argumentos demais."]}, {"q": "Frete grátis se o cliente for VIP OU a compra passar de R$ 300. Qual função combina as condições?", "o": ["OU", "E", "SOMASE", "PROCV"], "c": 0, "e": "OU é VERDADEIRO se pelo menos uma condição for verdadeira.", "w": ["E exigiria as duas ao mesmo tempo.", "SOMASE soma com critério, não testa duas condições.", "PROCV busca valores em tabela."]}, {"q": "=SE(F2>=9;\"Ótimo\";SE(F2>=7;\"Bom\";\"Recuperação\")). Com F2 = 8, o resultado é:", "o": ["Bom", "Ótimo", "Recuperação", "Erro"], "c": 0, "e": "8 não é ≥ 9 → vai para o segundo SE; 8 é ≥ 7 → \"Bom\".", "w": ["Ótimo só a partir de 9.", "Recuperação só abaixo de 7.", "O SE aninhado está correto."]}, {"q": "Por que, no SE aninhado por faixas, se testa primeiro a MAIOR faixa (>=9, depois >=7)?", "o": ["Porque o primeiro teste verdadeiro encerra a fórmula; se testar >=7 antes, quem tirou 9,5 cairia em \"Bom\"", "Porque endedor cujo nome está em H2?", "o": ["=SOMASE(B2:B50;H2;D2:D50)", "=SOMASE(B2:B50;\"H2\";D2:D50)", "=SOMA(D2:D50;H2)", "=CONT.SE(B2:B50;H2)"], "c": 0, "e": "O critério pode ser uma célula. Sem aspas, o Excel usa o nome que está em H2.", "w": ["Com aspas, procura o texto \"H2\", que não existe.", "SOMA não filtra por vendedor.", "CONT.SE conta as vendas, não soma o faturamento."]}, {"q": "Para o CONT.SE e o SOMASE do resumo funcionarem em todas as linhas ao arrastar, os intervalos devem estar:", "o": ["Travados com $ (ex.: $B$2:$B$50)", "Sem $", "Em outra planilha", "Em negrito"], "c": 0, "e": "Arrastando, o intervalo deslizaria para baixo e perderia linhas. Com $ ele fica fixo.", "w": ["Sem $ o intervalo muda a cada linha.", "Não precisa de outra planilha.", "Negrito é só aparência."]}], "procv": [{"q": "O que faz o PROCV?", "o": ["Procura um valor na PRIMEIRA coluna de uma tabela e traz uma informação da mesma linha", "Soma uma coluna inteira", "Conta células vazias", "Ordena a tabela"], "c": 0, "e": "Ex.: digito o código do produto e o PROCV traz o nome e o preço da tabela de produtos.", "w": ["Soma é SOMA.", "Contar vazias é CONTAR.VAZIO.", "Ordenar é Classificar."]}, {"q": "=PROCV(A2;$F$2:$H$20;3;FALSO). O que o 3 significa?", "o": ["Trazer a 3ª coluna da tabela F:H (coluna H)", "Procurar 3 vezes", "Trazer a coluna C da planilha", "Arredondar em 3 casas"], "c": 0, "e": "O número da coluna conta a partir da primeira coluna da TABELA, não da planilha.", "w": ["PROCV procura uma vez.", "Conta dentro da tabela F:H, não da planilha inteira.", "Quem arredonda é ARRED."]}, {"q": "Para buscar o código EXATO de um produto, o último argumento do PROCV deve ser:", "o": ["FALSO (ou 0)", "VERDADEIRO", "1", "Pode deixar em branco sempre"], "c": 0, "e": "FALSO = correspondência exata. Se o código não existir, aparece #N/D.", "w": ["VERDADEIRO busca aproximado: serve para faixas, não para códigos.", "1 equivale a VERDADEIRO.", "Em branco o Excel usa VERDADEIRO e pode trazer o nicial > Formatação Condicional > Realçar Regras > É Menor do que 7", "Pintar à mão cada nota", "Usar a função SE com a palavra vermelho", "Mudar o tema"], "c": 0, "e": "A formatação condicional pinta sozinha e muda quando o valor muda.", "w": ["Se a nota mudar, a cor fica errada.", "SE escreve texto, não pinta a célula.", "O tema muda as cores de tudo."]}, {"q": "A tabela é longa e o cabeçalho some quando você rola para baixo. O que resolve?", "o": ["Exibir > Congelar Painéis > Congelar Linha Superior", "Repetir o cabeçalho a cada 20 linhas", "Diminuir o zoom até caber", "Colocar o cabeçalho em negrito"], "c": 0, "e": "Congelar painéis deixa a linha de títulos sempre visível.", "w": ["Atrapalha filtros e fórmulas.", "Com zoom pequeno ninguém lê.", "Negrito não faz a linha ficar parada."]}, {"q": "No Edital, por que separar a pasta de trabalho em guias (01_PESQUISA, 02_PROPOSTA...)?", "o": ["Para organizar cada etapa e deixar as fórmulas buscarem dados de uma guia na outra", "Porque o Excel só aceita 10 linhas por guia", "Para gastar menos tinta", "Porque é obrigatório em todo arquivo"], "c": 0, "e": "Guias organizadas facilitam a conferência e a comissão encontra cada parte rapidinho.", "w": ["Cada guia tem mais de um milhão de linhas.", "Guias não mudam impressão.", "É uma boa prática, não regra do Excel."]}], "outlook": [{"q": "Para que serve o Outlook no trabalho?", "o": ["Gerenciar e-mails, calendário (agenda), contatos e tarefas num só lugar", "Criar planilhas com fórmulas", "Editar fotos", "Montar apresentações de slides"], "c": 0, "e": "O Outlook é o cliente de e-mail e agenda corporativa do Office.", "w": ["Planilhas são do Excel.", "Edição de fotos não é função do Outlook.", "Slides são do PowerPoint."]}, {"q": "Onde ficam os e-mails que você escreveu e ainda NÃO enviou?", "o": ["Rascunhos", "Itens Enviados", "Caixa de Entrada", "Lixo Eletrônico"], "c": 0, "e": "O Outlook guarda sozinho em Rascunhos o que você começou e não enviou.", "w": ["Itens Enviados s endereços deles, use:", "o": ["Cco (cópia oculta)", "Para, com os 40 endereços", "Cc, com os 40 endereços", "Encaminhar"], "c": 0, "e": "No Cco ninguém vê os outros destinatários. Isso protege a privacidade dos dados pessoais (LGPD).", "w": ["Todos veriam o e-mail de todos.", "Cc também mostra todos.", "Encaminhar reenvia uma mensagem recebida; não esconde endereços."]}, {"q": "O e-mail recebido tinha um anexo. Você clicou em Responder. O que acontece com o anexo?", "o": ["Ele NÃO vai junto na resposta", "Vai junto automaticamente", "É apagado do seu computador", "Vira um link"], "c": 0, "e": "Responder não leva anexos. Para repassar o arquivo, use Encaminhar.", "w": ["Isso acontece no Encaminhar.", "O anexo original continua no e-mail recebido.", "Ele simplesmente não é incluído."]}, {"q": "Em um e-mail com 8 pessoas, a resposta só interessa a quem enviou. Clique em:", "o": ["Responder", "Responder a Todos", "Encaminhar", "Novo Email para os 8"], "c": 0, "e": "Responder vai só para o remetente. Responder a Todos lota a caixa de quem não precisa.", "w": ["Mandaria para as 8 pessoas sem necessidade.", "Encaminhar é para mandar para outra pessoa.", "Sem necessidade incomoda todos."]}, {"q": "O arquivo da proposta tem 80 MB e o e-mail volta com erro. Melhor solução:", "o": ["Salvar no OneDrive/nuvem e enviar o link compartilhado", "Mandar em 20 e-mails", "Mudar o nome do arquivo", "Colocar no assunto"], "c": 0, "e": "Servidores de e-mail limitam o tamanho do anexo (em geral 20 a 25 MB). O link resolve e mantém uma versão só.", "w": ["Confunde o destinatário e pode ser barrado.", "O nome não muda o tamanho.", "Assunto é só texto."]}], "seguranca": [{"q": "Qual é a senha mais segura para o e-mail da empresa?", "o": ["Uma frase longa com letras, números e símbolos, só sua (ex.: Cafe#Quente2Vezes!)", "A data do seu aniversário", "123456", "O nome da empresa"], "c": 0, "e": "Senha forte é longa, difícil de adivinhar e não é usada em outros sites.", "w": ["Data de aniversário é fácil de descobrir nas redes sociais.", "É uma das senhas mais usadas do mundo.", "É a primeira coisa que um golpista tenta."]}, {"q": "Chega um e-mail \"do banco\" pedindo para clicar e confirmar sua senha com urgência. Isso é provavelmente:", "o": ["Phishing (golpe): não clique e avise o TI", "Um aviso oficial, deve clicar", "Uma promoção", "Um erro do Outlook"], "c": 0, "e": "Bancos e empresas sérias não pedem senha por e-mail. Urgência + link + pedido de senha = alerta vermelho.", "w": ["Instituição séria não pede senha por e-mail.", "Não há promoção que peça senha.", "É uma tentativa de golpe."]}, {"q": "Um colega pede sua senha \"só para enviar um arquivo\". Você deve:", "o": ["Não passar: a senha é pessoal; o arquivo pode ser compartilhado de outro jeito", "Passar, porque ele é colega", "Escrever num papel e colar no monitor", "Mandar a senha por e-mail"], "c": 0, "e": "Tudo o que é feito com a sua senha fica no seu nome. Compartilhe a pasta ou o arquivo, nunca a senha.", "w": ["Mesmo colega de confiança não deve ter sua senha.", "Papel no monitor qualquer um lê.", "E-mail com senha pode ser interceptado ou encaminhado."]}, {"q": "O que é a autenticação em dois fatores (MFA)?", "o": ["Além da senha, confirmar o acesso com um código no celular ou um aplicativo", "Ter duas senhas iguais", "Entrar duas vezes no e-mail", "Usar dois computadores"], "c": 0, "e": "Mesmo se roubarem a senha, sem o segundo fator o golpista não entra.", "w": ["Duas senhas iguais não protegem nada a mais.", "Entrar duas vezes não é proteção.", "O número de computadores não importa."]}, {"q": "Como conferir se um link do e-mail é confiável ANTES de clicar?", "o": ["Passar o mouse por cima e ver o endereço real que aparece", "Clicar para ver aonde vai", "Ver se o e-mail tem logotipo", "Ver se está em negrito"], "c": 0, "e": "O texto do link pode mentir; o endereço real aparece quando você passa o mouse.", "w": ["Clicar já pode instalar algo ou levar a um site falso.", "Logotipo se copia fácil.", "Negrito é só formatação."]}], "organiza": [{"q": "Todos os e-mails do fornecedor Alfa devem ir sozinhos para a pasta \"Fornecedores\". Use:", "o": ["Uma Regra (mover mensagens de Alfa para a pasta)", "Mover um por um todo dia", "Excluir os e-mails dele", "Marcar como Lixo Eletrônico"], "c": 0, "e": "Regras automatizam a organização: quando chega e-mail de X, mover para a pasta Y.", "w": ["Funciona, mas toma tempo todo dia.", "Perde informações importantes.", "Os e-mails iriam para o spam."]}, {"q": "Para ver rápido só as mensagens NÃO LIDAS da Caixa de Entrada:", "o": ["Usar o Filtro: Não Lidos", "Apagar as lidas", "Criar uma pasta nova", "Desligar o computador"], "c": 0, "e": "O filtro (Filtrar Email / Não Lidos) mostra só o que interessa, sem apagar nada.", "w": ["Apagar perde histórico.", "Pasta nova não separa sozinha as não lidas.", "Desligar não filtra nada."]}, {"q": "Um e-mail pede uma resposta até sexta. Para não esquecer, você pode:", "o": ["Sinalizar para acompanhamento (bandeira) com lembrete", "Apagar e lembrar de cabeça", "Mover para Lixo Eletrônico", "Responder \"ok\" e esquecer"], "c": 0, "e": "A bandeira cria uma tarefa com prazo e lembrete.", "w": ["Memória falha.", "Ali ele pode ser apagado sozinho.", "Responder não resolve a tarefa."]}, {"q": "Você procura o e-mail com o edital, enviado por \"comissao\". O mais rápido é:", "o": ["Usar a caixa Pesquisar com o remetente ou uma palavra do assunto", "Rolar a caixa inteira", "Pedir para reenviar", "Abrir um por um"], "c": 0, "e": "A pesquisa encontra por remetente, assunto, palavra ou anexo em segundos.", "w": ["Com centenas de e-mails, demora muito.", "Funciona, mas atrapalha quem mandou.", "Lento demais."]}, {"q": "Criar pastas como \"Clientes\", \"Financeiro\" e \"Edital\" serve para:", "o": ["Organizar por assunto e encontrar as mensagens mais rápido", "Aumentar o tamanho dos anexos", "Proteger com senha", "Enviar e-mails mais rápido"], "c": 0, "e": "Botão direito na caixa de correio > Nova Pasta. Depois arraste ou use regras.", "w": ["Pastas não mudam limite de anexo.", "Pastas não têm senha própria.", "Não mudam a velocidade de envio."]}], "contatos": [{"q": "Onde ficam salvos nomes, e-mails e telefones dos clientes no Outlook?", "o": ["Em Pessoas (Contatos / Catálogo de Endereços)", "Em Rascunhos", "Na Caixa de Saída", "No Calendário"], "c": 0, "e": "Em Pessoas você cadastra o contato uma vez e depois só digita o nome no campo Para.", "w": ["Rascunhos guarda e-mails não enviados.", "Caixa de Saída guarda o que está saindo.", "Calendário guarda compromissos."]}, {"q": "Você sempre manda e-mail para as mesmas 6 pessoas da equipe. O que facilita?", "o": ["Criar um Grupo de Contatos (lista) com as 6", "Digitar os 6 endereços toda vez", "Mandar para um e pedir para repassar", "Usar o Cco com um endereço só"], "c": 0, "e": "O grupo vira um nome só no campo Para, e ninguém fica de fora.", "w": ["Lento e fácil esquecer alguém.", "Atrasa e pode não chegar a todos.", "Só um receberia."]}, {"q": "Para que serve o Catálogo de Endereços da empresa (Lista Global)?", "o": ["Encontrar o e-mail de qualquer colega da empresa sem cadastrar", "Guardar as senhas da equipe", "Bloquear clientes", "Enviar anexos grandes"], "c": 0, "e": "Em contas corporativas, o catálogo traz os endereços de todos os funcionários, mantido pelo TI.", "w": ["Senha não fica em catálogo.", "Bloqueio é em Lixo Eletrônico > Bloquear Remetente.", "Anexo grande vai por link."]}, {"q": "Um colega novo precisa dos seus contatos de fornecedores. Como fazer do jeito certo?", "o": ["Compartilhar a pasta de contatos ou enviar os contatos (cartão de visita) por e-mail", "Passar a sua senha", "Fotografar a tela", "Ditar por telefone"], "c": 0, "e": "Compartilhar ou encaminhar o contato mantém os dados certos, sem expor sua conta.", "w": ["Senha não se compartilha.", "Foto dá erro de digitação depois.", "Ditar é lento e gera erros."]}, {"q": "Ao cadastrar um contato do cliente, o cuidado com os dados pessoais é:", "o": ["Guardar só o necessário para o trabalho e não repassar sem motivo (LGPD)", "Guardar CPF, endereço e foto de todos, por precaução", "Publicar a lista no site", "Mandar a lista para todos da empresa"], "c": 0, "e": "A LGPD pede finalidade e cuidado com dados pessoais.", "w": ["Juntar dados sem necessidade aumenta o risco.", "Expõe os clientes.", "Repassar sem motivo fere a privacidade."]}], "agenda": [{"q": "Qual a diferença entre COMPROMISSO e REUNIÃO no calendário do Outlook?", "o": ["Compromisso é só seu; Reunião convida outras pessoas, que aceitam ou recusam", "São iguais", "Reunião não tem horário", "Compromisso manda convite para todos"], "c": 0, "e": "Nova Reunião tem o campo Para: os convidados recebem o convite e respondem.", "w": ["A diferença está nos convidados.", "Reunião tem início e fim.", "Compromisso não convida ninguém."]}, {"q": "A reunião da equipe acontece toda segunda às 9h. Como não criar uma por uma?", "o": ["Usar Recorrência (repetir semanalmente)", "Copiar e colar 52 vezes", "Criar só a primeira e lembrar das outras", "Mandar um e-mail toda segunda"], "c": 0, "e": "A recorrência cria a série inteira; dá para mudar uma ocorrência só, se precisar.", "w": ["Trabalho desnecessário.", "Ninguém recebe lembrete das outras.", "E-mail não bloqueia a agenda."]}, {"q": "Além das pessoas, a reunião precisa da Sala 2 e do projetor. No Outlook corporativo isso se faz com:", "o": ["Recursos: adicionar a sala/equipamento como recurso no convite", "Um bilhete na porta", "Um compromisso particular", "Colocar a sala no assunto"], "c": 0, "e": "Salas e equipamentos podem ser cadastrados como recursos: o Outlook mostra se estão livres e os reserva.", "w": ["Não aparece na agenda de ninguém.", "Compromisso particular não reserva a sala.", "Escrever no assunto não reserva."]}, {"q": "Para ver se os convidados estão livres antes de marcar, use:", "o": ["O Assistente de Agendamento", "O Painel de Leitura", "A Caixa de Saída", "O Lixo Eletrônico"], "c": 0, "e": "Ele mostra os horários ocupados de cada convidado e sugere horários livres.", "w": ["O Painel de Leitura mostra e-mails.", "A Caixa de Saída tem mensagens saindo.", "O Lixo Eletrônico tem spam."]}, {"q": "Você quer que a sua coordenadora veja sua agenda para marcar reuniões. O caminho é:", "o": ["Compartilhar Calendário e escolher a permissão (ex.: ver só disponibilidade ou ver detalhes)", "Mandar a sua senha", "Imprimir a agenda todo dia", "Deixar o computador desbloqueado"], "c": 0, "e": "No compartilhamento você decide o que a pessoa vê e se ela pode editar.", "w": ["Senha nunca se compartilha.", "Papel fica desatualizado.", "Computador desbloqueado é risco de segurança."]}], "ppt": [{"q": "Qual modo de exibição mostra MINIATURAS de todos os slides para reorganizar a ordem?", "o": ["Classificação de Slides", "Normal", "Anotações", "Modo de Exibição de Leitura"], "c": 0, "e": "Em Classificação de Slides você arrasta os slides para mudar a ordem, duplica ou exclui.", "w": ["Normal é o modo de edição, um slide grande por vez.", "Anotações mostra o slide com as notas do apresentador.", "Leitura mostra a apresentação na janela, sem editar."]}, {"q": "Qual atalho insere um NOVO SLIDE?", "o": ["Ctrl+M", "Ctrl+N", "Ctrl+S", "F7"], "c": 0, "e": "Ctrl+M cria um slide novo logo depois do atual.", "w": ["Ctrl+N é negrito no Office em português.", "Ctrl+S é sublinhado.", "F7 é ortografia."]}, {"q": "Para trocar a organização de um slide (título + conteúdo, duas colunas, só título):", "o": ["Página Inicial > Layout", "Design > Tamanho do Slide", "Transições", "Arquivo > Imprimir"], "c": 0, "e": "O Layout define as caixas do slide. Os layouts vêm do Slide Mestre.", "w": ["Tamanho muda a proporção (16:9 ou 4:3).", "Transições são efeitos entre slides.", "Imprimir não muda o layout."]}, {"q": "Para colocar o logotipo da empresa em TODOS os slides de uma vez:", "o": ["Exibir > Slide Mestre e inserir o logo no mestre", "Colar o logo em cada slide", "Usar uma transição", "Colocar o logo nas anotações"], "c": 0, "e": "O Slide Mestre é o modelo de todos os layouts: o que entra nele aparece em todos os slides.", "w": ["Funciona, mas dá retrabalho e pode desalinhar.", "Transição é efeito de passagem.", "Anotações não aparecem no slide."]}, {"q": "Onde o apresentador escreve lembretes que o PÚBLICO NÃO VÊ?", "o": ["No painel de Anotações, embaixo do slide", "No título do slide", "Numa caixa de texto pequena no canto", "No rodapé"], "c": 0, "e": "As anotações aparecem só no Modo de Exibição do Apresentador e podem ser impressas.", "w": ["O título aparece para todos.", "A caixa aparece no telão.", "O rodapé também aparece no slide."]}], "pptobj": [{"q": "Para transformar uma lista de etapas em um diagrama bonito, com caixas e setas:", "o": ["Inserir > SmartArt (ou Converter em SmartArt)", "Desenhar cada seta com o mouse", "Usar uma tabela", "Colocar tudo em negrito"], "c": 0, "e": "O SmartArt cria processos, ciclos e organogramas prontos, que se ajustam ao texto.", "w": ["Funciona, mas demora e fica desalinhado.", "Tabela não mostra fluxo.", "Negrito não vira diagrama."]}, {"q": "Você quer mostrar o gráfico de evolução do Excel no slide. O que é melhor?", "o": ["Copiar o gráfico do Excel e colar no PowerPoint (ou Inserir > Gráfico)", "Digitar os números num parágrafo", "Fazer um print desfocado", "Desenhar as barras com formas"], "c": 0, "e": "O gráfico colado mantém a qualidade e pode ser formatado. Confira se os valores são os mesmos da planilha.", "w": ["Texto com números não mostra a evolução.", "Print desfocado parece pouco profissional.", "Desenhar à mão gera erros de proporção."]}, {"q": "Para alinhar três imagens com espaços iguais entre elas:", "o": ["Selecionar as três > Formato da Forma/Imagem > Alinhar > Distribuir Horizontalmente", "Arrastar no olho", "Diminuir o zoom", "Recortar as imagens"], "c": 0, "e": "Alinhar e Distribuir deixam tudo preciso, sem depender do olho.", "w": ["No olho quase nunca fica igual.", "Zoom
